<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;">
    <title>Admin - License Verification | OverXchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="modern-styles.css">
    <style>
        body {
            background: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--glass-gradient);
            backdrop-filter: var(--glass-blur);
            border-radius: var(--border-radius-lg);
            margin-bottom: 30px;
            box-shadow: var(--shadow-light);
        }

        .header-bar h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: var(--gradient-danger);
        }

        .stat-card {
            text-align: center;
        }
        
        .stat-card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-card.pending i { color: #f59e0b; }
        .stat-card.verified i { color: #10b981; }
        .stat-card.rejected i { color: #ef4444; }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .licenses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
        }

        .license-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .license-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .license-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .license-status {
            padding: 5px 12px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-pending {
            background-color: #fef3c7;
            color: #92400e;
        }

        .license-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: var(--glass-blur);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-secondary);
        }
        
        .close:hover {
            color: var(--text-primary);
        }
        
        .loading, .no-licenses {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="floating-shapes">
            <div class="shape"></div><div class="shape"></div><div class="shape"></div><div class="shape"></div><div class="shape"></div>
        </div>
    </div>

    <div class="container">
        <div class="header-bar">
            <h1><i class="fas fa-shield-alt text-gradient"></i> License Verification</h1>
            <div class="admin-info">
                <span>Welcome, <strong id="adminName">Admin</strong></span>
                <button onclick="logout()" class="btn-3d logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="stats-cards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="stat-card glass-card pending">
                <i class="fas fa-clock"></i>
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card glass-card verified">
                <i class="fas fa-check-circle"></i>
                <div class="stat-number" id="verifiedCount">0</div>
                <div class="stat-label">Verified Today</div>
            </div>
            <div class="stat-card glass-card rejected">
                <i class="fas fa-times-circle"></i>
                <div class="stat-number" id="rejectedCount">0</div>
                <div class="stat-label">Rejected Today</div>
            </div>
        </div>

        <div class="glass-card" style="padding: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="font-size: 1.8rem; color: var(--text-primary);">Pending Licenses</h2>
                <button class="btn-3d" onclick="loadPendingLicenses()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
            
            <div id="licensesContainer">
                <div class="loading"><div class="loading-3d"></div><p>Loading licenses...</p></div>
            </div>
        </div>
    </div>

    <div id="verificationModal" class="modal">
        <div class="modal-content glass-card" style="padding: 30px;">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" style="margin-bottom: 20px; color: var(--text-primary);">Verify License</h3>
            <div class="form-group">
                <textarea id="adminNotes" class="input-3d" placeholder="Add optional notes..." style="width: 100%; min-height: 100px;"></textarea>
            </div>
            <div class="modal-actions" style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 25px;">
                <button class="btn-3d" onclick="closeModal()">Cancel</button>
                <button class="btn-3d btn-pink" onclick="verifyLicense('approve')">Approve</button>
                <button class="btn-3d" style="background: var(--gradient-danger);" onclick="verifyLicense('reject')">Reject</button>
            </div>
        </div>
    </div>
    
    <button class="theme-toggle" onclick="toggleTheme()">
        <div class="icon-container">
            <i class="fas fa-sun sun-icon"></i>
            <i class="fas fa-moon moon-icon"></i>
        </div>
    </button>

    <script>
        // Paste the original JavaScript here, then add the theme toggle function.
        let currentLicenseId = null;
        let pendingLicenses = [];

        document.addEventListener('DOMContentLoaded', function() {
            const userType = localStorage.getItem('user_type');
            const userId = localStorage.getItem('user_id');
            
            if (userType !== 'admin' || !userId) {
                window.location.href = 'login.html';
                return;
            }
            
            const adminName = localStorage.getItem('admin_name') || localStorage.getItem('name') || 'Admin';
            document.getElementById('adminName').textContent = adminName;
            
            loadPendingLicenses();
            updateStats();
        });

        function logout() {
            ['user_type', 'user_id', 'supplier_name', 'business_name', 'name', 'admin_name', 'admin_role', 'admin_email', 'adminLoggedIn', 'adminId', 'adminEmail', 'adminName', 'adminRole'].forEach(item => localStorage.removeItem(item));
            window.location.href = 'login.html';
        }

        async function loadPendingLicenses() {
            document.getElementById('licensesContainer').innerHTML = `<div class="loading"><div class="loading-3d"></div><p>Loading licenses...</p></div>`;
            try {
                const response = await fetch('/api/admin/licenses/pending');
                const data = await response.json();
                pendingLicenses = data.success ? data.licenses : [];
                displayLicenses(pendingLicenses);
            } catch (error) {
                document.getElementById('licensesContainer').innerHTML = `<div class="no-licenses"><i class="fas fa-server"></i><h3>Connection Error</h3><p>Could not fetch data.</p></div>`;
            }
        }

        function displayLicenses(licenses) {
            const container = document.getElementById('licensesContainer');
            if (licenses.length === 0) {
                container.innerHTML = `<div class="no-licenses"><i class="fas fa-inbox"></i><h3>All Clear!</h3><p>No pending licenses to review.</p></div>`;
                return;
            }

            container.innerHTML = licenses.map(license => `
                <div class="license-card">
                    <div class="license-header">
                        <div>
                            <h3 style="color: var(--text-primary);">${license.supplier_name || 'Unknown'}</h3>
                            <p style="color: var(--text-secondary); font-size: 0.9rem;"><i class="fas fa-envelope"></i> ${license.supplier_email || 'N/A'}</p>
                        </div>
                        <span class="license-status status-pending">Pending</span>
                    </div>
                    <p style="color: var(--text-secondary); margin-bottom: 15px;">Submitted: ${new Date(license.upload_date).toLocaleDateString()}</p>
                    <div class="license-actions">
                        <button class="btn-3d" onclick="openVerificationModal('${license._id}', 'approve')"><i class="fas fa-check"></i> Approve</button>
                        <button class="btn-3d" style="background: var(--gradient-warning);" onclick="openVerificationModal('${license._id}', 'reject')"><i class="fas fa-times"></i> Reject</button>
                    </div>
                </div>
            `).join('');
        }

        async function updateStats() {
            try {
                const response = await fetch('/api/admin/licenses/stats');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('pendingCount').textContent = data.stats.pending;
                    document.getElementById('verifiedCount').textContent = data.stats.verified_today;
                    document.getElementById('rejectedCount').textContent = data.stats.rejected_today;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function openVerificationModal(licenseId, action) {
            currentLicenseId = licenseId;
            const modal = document.getElementById('verificationModal');
            document.getElementById('modalTitle').textContent = action === 'approve' ? 'Approve License' : 'Reject License';
            document.getElementById('adminNotes').value = '';
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('verificationModal').style.display = 'none';
            currentLicenseId = null;
        }

        async function verifyLicense(action) {
            if (!currentLicenseId) return;
            const notes = document.getElementById('adminNotes').value;
            
            try {
                const response = await fetch(`/api/admin/license/verify/${currentLicenseId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, notes })
                });
                const data = await response.json();
                if (data.success) {
                    closeModal();
                    loadPendingLicenses();
                    updateStats();
                } else {
                    alert('Failed to verify license: ' + data.message);
                }
            } catch (error) {
                alert('Error verifying license: ' + error.message);
            }
        }
        
        function toggleTheme() {
            const body = document.body;
            body.dataset.theme = body.dataset.theme === 'dark' ? '' : 'dark';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('verificationModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
