<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;">
    <title>Login - OverXchange</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="modern-styles.css">
    <style>
        /* Login Page Specific Styles */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .login-card {
            background: var(--card-gradient);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-xl);
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-heavy);
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            animation: card-float 8s ease-in-out infinite;
        }

        @keyframes card-float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .login-card:hover {
            box-shadow: var(--shadow-heavy);
            transform: translateY(-5px) scale(1.01);
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--secondary-gradient);
            transform: scaleX(0);
            transition: transform 0.5s ease-in-out;
            transform-origin: left;
        }

        .login-card:hover::before {
            transform: scaleX(1);
            transform-origin: right;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            background: var(--secondary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            color: var(--white);
            box-shadow: var(--shadow-pink);
        }

        .login-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            z-index: 2;
        }

        .input-3d {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: var(--glass-gradient);
            backdrop-filter: var(--glass-blur);
            border: 2px solid var(--glass-border);
            border-radius: var(--border-radius);
            font-size: 16px;
            color: var(--text-primary);
            transition: var(--transition);
            transform-style: preserve-3d;
        }

        .input-3d:focus {
            outline: none;
            border-color: var(--pink);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
            transform: translateY(-3px) scale(1.02);
        }

        .input-3d:focus+.input-icon {
            color: var(--pink);
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: var(--primary-gradient);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            transform-style: preserve-3d;
            box-shadow: 0 5px 0 var(--dark-blue), 0 8px 20px rgba(30, 58, 138, 0.3);
            position: relative;
            overflow: hidden;
            margin-top: 10px;
            transform: perspective(1000px) rotateX(0deg);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover {
            transform: perspective(1000px) translateY(-5px) rotateX(10deg) scale(1.02);
            box-shadow: 0 8px 0 var(--dark-blue-2), 0 12px 30px rgba(30, 58, 138, 0.4);
        }

        .login-btn:active {
            transform: perspective(1000px) translateY(2px) rotateX(2deg) scale(1.01);
            box-shadow: 0 2px 0 var(--dark-blue-2), 0 4px 10px rgba(30, 58, 138, 0.3);
        }

        .login-footer {
            text-align: center;
            margin-top: 30px;
        }

        .login-footer a {
            color: var(--pink);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .login-footer a:hover {
            color: var(--dark-blue);
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: var(--border-radius);
            background: var(--glass-gradient);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            transform-style: preserve-3d;
        }

        .back-home:hover {
            background: var(--secondary-gradient);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-pink);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 12px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #059669;
            padding: 12px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            display: none;
        }

        .google-btn {
            background: #4285F4;
            color: white;
        }

        .google-btn:hover {
            background: #357ae8;
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 40px 30px;
                margin: 20px;
            }

            .login-title {
                font-size: 2rem;
            }

            .back-home {
                top: 20px;
                left: 20px;
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
    </div>

    <!-- Back to Home -->
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-user-lock"></i>
                </div>
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Sign in to your OverXchange account</p>
            </div>

            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-group">
                        <input type="email" id="email" name="email" class="input-3d" placeholder="Enter your email"
                            required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" name="password" class="input-3d"
                            placeholder="Enter your password" required>
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>



            <div class="login-footer">
                <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
            </div>
        </div>
    </div>

    <!-- Enhanced Theme Toggle -->
    <button class="theme-toggle" onclick="toggleTheme()">
        <div class="icon-container">
            <i class="fas fa-sun sun-icon"></i>
            <i class="fas fa-moon moon-icon"></i>
        </div>
        <div class="symbol-label">☀️ Light Mode</div>
        <div class="mode-indicator">🌙 Dark Mode</div>
    </button>

    <script>
        // Enhanced Theme Toggle Functionality
        function toggleTheme() {
            const body = document.body;
            // ... (theme logic)
        }

        function handleSuccessfulLogin(data) {
            const successMessage = document.getElementById('success-message');
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('user_type', data.user_type);
            localStorage.setItem('user_name', data.name || '');
            localStorage.setItem('token', data.token);

            successMessage.textContent = 'Login successful! Redirecting...';
            successMessage.style.display = 'block';

            setTimeout(() => {
                if (data.user_type === 'vendor') {
                    window.location.href = 'vendor-dashboard.html';
                } else if (data.user_type === 'supplier') {
                    window.location.href = 'supply-dashboard.html';
                } else if (data.user_type === 'admin') {
                    window.location.href = 'admin-license-verification.html';
                } else {
                    window.location.href = 'profile.html';
                }
            }, 1500);
        }



        // Setup event listeners after the DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            // Login Form Handling
            document.getElementById('login-form').addEventListener('submit', async function (e) {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorMessage = document.getElementById('error-message');
                const successMessage = document.getElementById('success-message');

                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: email, password: password })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        handleSuccessfulLogin(data);
                    } else {
                        errorMessage.textContent = data.message || data.error || 'Login failed. Please try again.';
                        errorMessage.style.display = 'block';
                    }
                } catch (error) {
                    errorMessage.textContent = 'Network error. Please check your connection.';
                    errorMessage.style.display = 'block';
                }
            });

            // Input focus effects
            document.querySelectorAll('.input-3d').forEach(input => {
                input.addEventListener('focus', function () {
                    this.parentElement.style.transform = 'translateY(-2px)';
                });

                input.addEventListener('blur', function () {
                    this.parentElement.style.transform = 'translateY(0)';
                });
            });
        });
    </script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <footer class="footer">
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Contact Us</a>
        </div>
        <p>&copy; 2025 OverXchange. All rights reserved.</p>
    </footer>
</body>
</head>

</html>
