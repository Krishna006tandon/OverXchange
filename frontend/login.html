<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OverXchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', Arial, sans-serif; background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%); margin: 0; padding: 0; min-height: 100vh; position: relative; }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/cubes.png') repeat;
            opacity: 0.08;
            z-index: 0;
        }
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(90deg, #3730a3 0%, #6366f1 100%);
            box-shadow: 0 8px 32px 0 rgba(99,102,241,0.18);
            border-radius: 0 0 22px 22px;
            backdrop-filter: blur(12px);
            border-bottom: 2px solid #a5b4fc44;
            padding: 0;
            transition: box-shadow 0.2s;
        }
        .navbar-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            height: 72px;
            padding: 0 28px;
        }
        .navbar-logo {
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 1.7em;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            margin-right: 38px;
            gap: 12px;
        }
        .navbar-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px #6366f133;
        }
        .navbar-logo-icon svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.13em;
            margin-right: 8px;
            font-weight: 500;
            padding: 10px 22px;
            border-radius: 10px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.18s;
        }
        .navbar a:hover {
            background: #fff3;
            color: #3730a3;
            box-shadow: 0 2px 8px #6366f133;
            transform: translateY(-2px) scale(1.04);
        }
        .navbar .signup-btn {
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            color: #fff;
            font-weight: 800;
            font-size: 1.18em;
            margin-right: 0;
            box-shadow: 0 4px 16px #6366f144;
            border: none;
            border-radius: 14px;
            padding: 12px 32px;
            letter-spacing: 0.5px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.18s;
        }
        .navbar .signup-btn:hover {
            background: linear-gradient(90deg, #818cf8 0%, #6366f1 100%);
            color: #fff;
            box-shadow: 0 6px 24px #6366f155;
            transform: translateY(-3px) scale(1.07);
        }
        .login-container {
            max-width: 410px;
            margin: 70px auto 0 auto;
            background: rgba(255,255,255,0.98);
            border-radius: 22px;
            box-shadow: 0 8px 32px #6366f122, 0 1.5px 0 #a5b4fc44;
            padding: 44px 32px 32px 32px;
            text-align: center;
            border: 2.5px solid #a5b4fc44;
            position: relative;
            animation: fadeIn 0.7s cubic-bezier(.39,.575,.56,1.000);
        }
        .login-avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
            box-shadow: 0 2px 8px #6366f133;
        }
        .login-avatar svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }
        .login-container h2 { color: #3730a3; margin-bottom: 18px; font-size: 2em; font-weight: 800; letter-spacing: 0.5px; }
        .login-container form { display: flex; flex-direction: column; gap: 18px; }
        .login-container input {
            padding: 14px;
            border-radius: 10px;
            border: 1.5px solid #c7d2fe;
            font-size: 1.08em;
            background: #f3f4f6;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .login-container input:focus {
            border: 1.5px solid #6366f1;
            box-shadow: 0 2px 8px #6366f122;
            outline: none;
        }
        .login-container button {
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1.13em;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px #6366f144;
            transition: background 0.2s, transform 0.18s;
        }
        .login-container button:hover {
            background: linear-gradient(90deg, #818cf8 0%, #6366f1 100%);
            transform: translateY(-2px) scale(1.04);
        }
        .login-links { margin-top: 18px; font-size: 1em; }
        .login-links a { color: #6366f1; text-decoration: none; margin: 0 8px; font-weight: 600; }
        .login-links a:hover { text-decoration: underline; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <span class="navbar-logo-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 13l3 3 7-7" stroke="#fff" stroke-width="2" fill="none"/></svg>
                </span>
                OverXchange
            </a>
            <div class="navbar-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="signup.html" class="signup-btn">Signup</a>
            </div>
        </div>
    </nav>
    <div class="login-container">
        <div class="login-avatar">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4.5"/><path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6"/></svg>
        </div>
        <h2>Login</h2>
        <form>
            <input type="text" placeholder="Phone or Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="login-links">
            New to OverXchange?<br>
            <a href="signup_vendor.html">Vendor Signup</a> |
            <a href="signup_supplier.html">Supplier Signup</a>
        </div>
    </div>
</body>
</html>
