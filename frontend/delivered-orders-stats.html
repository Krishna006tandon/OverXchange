<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivered Orders Statistics - OverXchange</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .stats-container {
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .stat-card.delivered {
            border-color: #28a745;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        }

        .stat-card.remaining {
            border-color: #ffc107;
            background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
        }

        .stat-card.total {
            border-color: #667eea;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        }

        .stat-card.value {
            border-color: #17a2b8;
            background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #333;
        }

        .stat-label {
            font-size: 1rem;
            color: #666;
            font-weight: 600;
        }

        .progress-section {
            margin-top: 30px;
        }

        .progress-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .progress-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .progress-percentage {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .breakdown-section {
            margin-top: 30px;
        }

        .breakdown-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
        }

        .breakdown-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .breakdown-list {
            list-style: none;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .breakdown-item:last-child {
            border-bottom: none;
        }

        .breakdown-label {
            display: flex;
            align-items: center;
            font-weight: 600;
        }

        .breakdown-icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .breakdown-count {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e9ecef;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 40px 20px;
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            margin: 20px 0;
        }

        .supplier-info {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .supplier-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1976d2;
            margin-bottom: 5px;
        }

        .supplier-id {
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .stat-number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Delivered Orders Statistics</h1>
            <p>Track your order delivery performance and remaining orders</p>
        </div>

        <div class="controls">
            <div class="form-group">
                <label for="supplierId">Supplier ID:</label>
                <input type="text" id="supplierId" placeholder="Enter supplier ID (e.g., supplier123)" value="supplier123">
            </div>
            <button class="btn" onclick="fetchStats()">📈 Fetch Statistics</button>
        </div>

        <div class="stats-container" id="statsContainer">
            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>Loading statistics...</p>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            const supplierId = document.getElementById('supplierId').value.trim();
            
            if (!supplierId) {
                alert('Please enter a supplier ID');
                return;
            }

            const container = document.getElementById('statsContainer');
            const loading = document.getElementById('loading');
            
            // Show loading
            container.innerHTML = '';
            container.appendChild(loading);
            loading.style.display = 'block';

            try {
                const response = await fetch(`/api/orders/delivered-stats/${supplierId}`);
                const data = await response.json();

                if (data.success) {
                    displayStats(data);
                } else {
                    showError(data.message);
                }
            } catch (error) {
                showError('Failed to fetch statistics: ' + error.message);
            }
        }

        function displayStats(data) {
            const container = document.getElementById('statsContainer');
            const stats = data.stats;
            const supplierName = data.supplier_name;

            container.innerHTML = `
                <div class="supplier-info">
                    <div class="supplier-name">${supplierName}</div>
                    <div class="supplier-id">ID: ${document.getElementById('supplierId').value}</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card total">
                        <div class="stat-icon">📦</div>
                        <div class="stat-number">${stats.total_orders}</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                    
                    <div class="stat-card delivered">
                        <div class="stat-icon">✅</div>
                        <div class="stat-number">${stats.delivered_orders}</div>
                        <div class="stat-label">Delivered Orders</div>
                    </div>
                    
                    <div class="stat-card remaining">
                        <div class="stat-icon">⏳</div>
                        <div class="stat-number">${stats.remaining_orders}</div>
                        <div class="stat-label">Remaining Orders</div>
                    </div>
                    
                    <div class="stat-card value">
                        <div class="stat-icon">💰</div>
                        <div class="stat-number">₹${stats.total_delivered_value.toFixed(2)}</div>
                        <div class="stat-label">Total Delivered Value</div>
                    </div>
                </div>

                <div class="progress-section">
                    <div class="progress-card">
                        <div class="progress-header">
                            <div class="progress-title">Delivery Progress</div>
                            <div class="progress-percentage">${stats.delivery_rate}%</div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${stats.delivery_rate}%"></div>
                        </div>
                    </div>
                </div>

                <div class="breakdown-section">
                    <div class="breakdown-card">
                        <div class="breakdown-title">📋 Order Breakdown</div>
                        <ul class="breakdown-list">
                            <li class="breakdown-item">
                                <div class="breakdown-label">
                                    <span class="breakdown-icon">✅</span>
                                    Delivered Orders
                                </div>
                                <div class="breakdown-count">${stats.delivered_orders}</div>
                            </li>
                            <li class="breakdown-item">
                                <div class="breakdown-label">
                                    <span class="breakdown-icon">⏳</span>
                                    Pending Orders
                                </div>
                                <div class="breakdown-count">${stats.pending_orders}</div>
                            </li>
                            <li class="breakdown-item">
                                <div class="breakdown-label">
                                    <span class="breakdown-icon">❌</span>
                                    Rejected Orders
                                </div>
                                <div class="breakdown-count">${stats.rejected_orders}</div>
                            </li>
                            <li class="breakdown-item">
                                <div class="breakdown-label">
                                    <span class="breakdown-icon">📦</span>
                                    Total Orders
                                </div>
                                <div class="breakdown-count">${stats.total_orders}</div>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="progress-section">
                    <div class="progress-card">
                        <div class="progress-header">
                            <div class="progress-title">🎯 Remaining Orders to Deliver</div>
                            <div class="progress-percentage">${stats.remaining_orders}</div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${stats.remaining_orders > 0 ? (stats.remaining_orders / stats.total_orders) * 100 : 0}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            const container = document.getElementById('statsContainer');
            container.innerHTML = `
                <div class="error">
                    <h3>❌ Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // Auto-fetch stats on page load if supplier ID is provided
        document.addEventListener('DOMContentLoaded', function() {
            const supplierId = document.getElementById('supplierId').value;
            if (supplierId) {
                fetchStats();
            }
        });
    </script>
</body>
</html>
