<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Signup - OverXchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', Arial, sans-serif; background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%); margin: 0; padding: 0; min-height: 100vh; }
        .navbar { position: sticky; top: 0; z-index: 100; background: linear-gradient(90deg, #3730a3 0%, #6366f1 100%); box-shadow: 0 4px 24px #6366f133; border-radius: 0 0 18px 18px; backdrop-filter: blur(6px); padding: 0; transition: box-shadow 0.2s; }
        .navbar-container { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; height: 64px; padding: 0 18px; }
        .navbar-logo { display: flex; align-items: center; color: #fff; font-size: 1.5em; font-weight: 700; letter-spacing: 1px; text-decoration: none; margin-right: 32px; gap: 10px; }
        .navbar-logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px #6366f133; }
        .navbar-logo-icon svg { width: 20px; height: 20px; fill: #fff; }
        .navbar-links { display: flex; align-items: center; }
        .navbar a { color: #fff; text-decoration: none; font-size: 1.1em; margin-right: 24px; font-weight: 500; padding: 8px 18px; border-radius: 8px; transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
        .navbar a:hover { background: #fff3; color: #3730a3; box-shadow: 0 2px 8px #6366f133; }
        .signup-container { max-width: 500px; margin: 60px auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px #6366f11a; padding: 36px 28px 28px 28px; text-align: center; }
        .signup-container h2 { color: #3730a3; margin-bottom: 18px; font-size: 2em; }
        .signup-container form { display: flex; flex-direction: column; gap: 16px; }
        .signup-container input, .signup-container select { padding: 12px; border-radius: 8px; border: 1px solid #c7d2fe; font-size: 1em; }
        .signup-container button { background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 1.1em; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px #6366f133; transition: background 0.2s, transform 0.2s; }
        .signup-container button:hover { background: linear-gradient(90deg, #818cf8 0%, #6366f1 100%); transform: translateY(-2px) scale(1.03); }
        .signup-links { margin-top: 18px; font-size: 0.98em; }
        .signup-links a { color: #6366f1; text-decoration: none; margin: 0 8px; font-weight: 500; }
        .signup-links a:hover { text-decoration: underline; }
        #message { margin-top: 15px; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <span class="navbar-logo-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 13l3 3 7-7" stroke="#fff" stroke-width="2" fill="none"/></svg>
                </span>
                OverXchange
            </a>
            <div class="navbar-links">
                <a href="index.html">Home</a>
            </div>
        </div>
    </nav>
    <div class="signup-container">
        <h2>Vendor Signup</h2>
        <form id="signup-form">
            <input type="text" id="first_name" placeholder="First Name" required>
            <input type="text" id="last_name" placeholder="Last Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="text" id="phone" placeholder="Phone Number" required>
            <input type="text" id="address" placeholder="Address" required>
            <button type="submit">Sign Up as Vendor</button>
        </form>
        <div id="message"></div>
        <div class="signup-links">
            Already have an account? <a href="login.html">Login</a><br>
            Want to sell in bulk? <a href="signup_supplier.html">Supplier Signup</a>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const first_name = document.getElementById('first_name').value;
            const last_name = document.getElementById('last_name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/signup/vendor', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        first_name,
                        last_name,
                        email,
                        password,
                        phone,
                        address
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.textContent = 'Signup successful!';
                    messageDiv.className = 'success';
                } else {
                    messageDiv.textContent = data.message || 'Signup failed';
                    messageDiv.className = 'error';
                }
            } catch (error) {
                messageDiv.textContent = 'An error occurred. Please try again.';
                messageDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
