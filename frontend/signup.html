<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>साइनअप - OverXchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', Arial, sans-serif; background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%); margin: 0; padding: 0; min-height: 100vh; position: relative; }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/cubes.png') repeat;
            opacity: 0.08;
            z-index: 0;
        }
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(90deg, #3730a3 0%, #6366f1 100%);
            box-shadow: 0 8px 32px 0 rgba(99,102,241,0.18);
            border-radius: 0 0 22px 22px;
            backdrop-filter: blur(12px);
            border-bottom: 2px solid #a5b4fc44;
            padding: 0;
            transition: box-shadow 0.2s;
        }
        .navbar-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            height: 72px;
            padding: 0 28px;
        }
        .navbar-logo {
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 1.7em;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            margin-right: 38px;
            gap: 12px;
        }
        .navbar-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px #6366f133;
        }
        .navbar-logo-icon svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.13em;
            margin-right: 8px;
            font-weight: 500;
            padding: 10px 22px;
            border-radius: 10px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.18s;
        }
        .navbar a:hover {
            background: #fff3;
            color: #3730a3;
            box-shadow: 0 2px 8px #6366f133;
            transform: translateY(-2px) scale(1.04);
        }
        .navbar .signup-btn {
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            color: #fff;
            font-weight: 800;
            font-size: 1.18em;
            margin-right: 0;
            box-shadow: 0 4px 16px #6366f144;
            border: none;
            border-radius: 14px;
            padding: 12px 32px;
            letter-spacing: 0.5px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.18s;
        }
        .navbar .signup-btn:hover {
            background: linear-gradient(90deg, #818cf8 0%, #6366f1 100%);
            color: #fff;
            box-shadow: 0 6px 24px #6366f155;
            transform: translateY(-3px) scale(1.07);
        }
        .signup-container {
            max-width: 520px;
            margin: 70px auto 0 auto;
            background: rgba(255,255,255,0.98);
            border-radius: 22px;
            box-shadow: 0 8px 32px #6366f122, 0 1.5px 0 #a5b4fc44;
            padding: 44px 32px 32px 32px;
            text-align: center;
            border: 2.5px solid #a5b4fc44;
            position: relative;
            animation: fadeIn 0.7s cubic-bezier(.39,.575,.56,1.000);
        }
        .signup-avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
            box-shadow: 0 2px 8px #6366f133;
        }
        .signup-avatar svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }
        .signup-container h2 { color: #3730a3; margin-bottom: 18px; font-size: 2em; font-weight: 800; letter-spacing: 0.5px; }
        .signup-container form { display: flex; flex-direction: column; gap: 16px; }
        .signup-container input, .signup-container select {
            padding: 14px;
            border-radius: 10px;
            border: 1.5px solid #c7d2fe;
            font-size: 1.08em;
            background: #f3f4f6;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .signup-container input:focus, .signup-container select:focus {
            border: 1.5px solid #6366f1;
            box-shadow: 0 2px 8px #6366f122;
            outline: none;
        }
        .signup-container button {
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1.13em;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px #6366f144;
            transition: background 0.2s, transform 0.18s;
        }
        .signup-container button:hover {
            background: linear-gradient(90deg, #818cf8 0%, #6366f1 100%);
            transform: translateY(-2px) scale(1.04);
        }
        .signup-links { margin-top: 18px; font-size: 1em; }
        .signup-links a { color: #6366f1; text-decoration: none; margin: 0 8px; font-weight: 600; }
        .signup-links a:hover { text-decoration: underline; }
        .role-toggle { display: flex; justify-content: center; gap: 16px; margin-bottom: 18px; }
        .role-toggle button {
            background: #e0e7ff;
            color: #3730a3;
            border: none;
            border-radius: 999px;
            padding: 10px 32px;
            font-size: 1.08em;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .role-toggle button.active, .role-toggle button:hover {
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            color: #fff;
        }
        .message { margin-top: 18px; font-size: 1.1em; font-weight: 500; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: none; }
        }
        @media (max-width: 700px) { .signup-container { padding: 18px 4px 18px 4px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <span class="navbar-logo-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 13l3 3 7-7" stroke="#fff" stroke-width="2" fill="none"/></svg>
                </span>
                OverXchange
            </a>
            <div class="navbar-links">
                <a href="index.html">होम</a>
                <a href="login.html">लॉगिन</a>
                <a href="signup.html" class="signup-btn">साइनअप</a>
            </div>
        </div>
    </nav>
    <div class="signup-container">
        <div class="signup-avatar">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4.5"/><path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6"/></svg>
        </div>
        <h2>साइनअप</h2>
        <div class="role-toggle">
            <button id="vendorBtn" class="active" type="button">वेंडर</button>
            <button id="supplierBtn" type="button">आपूर्तिकर्ता</button>
        </div>
        <form id="signupForm">
            <div id="vendorFields">
                <input type="text" name="business_name" placeholder="व्यवसाय का नाम" required>
                <div style="text-align:left; font-weight:700; color:#3730a3; margin-bottom:6px;">वेंडर प्रकार: भोजन और पेय</div>
                <input type="text" name="food_beverage_details" placeholder="भोजन और पेय विवरण" required>
                <input type="text" name="business_address" placeholder="व्यवसाय का पता" required>
                <input type="text" name="pincode" placeholder="पिनकोड" required>
                <input type="tel" name="phone" placeholder="फोन" required>
                <input type="email" name="email" placeholder="ईमेल" required>
                <input type="password" name="password" placeholder="पासवर्ड" required>
                <input type="text" name="gstin" placeholder="GSTIN (वैकल्पिक)">
                <input type="text" name="preferred_categories" placeholder="पसंदीदा उत्पाद श्रेणियां" required>
                <input type="text" name="invite_code" placeholder="आमंत्रण कोड (वैकल्पिक)">
            </div>
            <div id="supplierFields" style="display:none;">
                <input type="text" name="business_name" placeholder="व्यवसाय का नाम" required>
                <input type="file" name="business_logo" accept="image/*" style="padding:8px;">
                <input type="text" name="product_categories" placeholder="आपूर्ति की जाने वाली उत्पाद श्रेणियां" required>
                <input type="text" name="warehouse_address" placeholder="गोदाम का पता" required>
                <input type="tel" name="phone" placeholder="फोन" required>
                <input type="email" name="email" placeholder="ईमेल" required>
                <input type="password" name="password" placeholder="पासवर्ड" required>
                <input type="text" name="gstin" placeholder="GSTIN (अनिवार्य)" required>
                <input type="text" name="business_proof" placeholder="व्यवसाय प्रमाण (अनिवार्य)" required>
                <input type="number" name="moq" placeholder="न्यूनतम आदेश मात्रा (MOQ)" required>
                <input type="text" name="logistics_options" placeholder="उपलब्ध लॉजिस्टिक्स विकल्प" required>
            </div>
            <button type="submit">साइन अप करें</button>
        </form>
        <div class="signup-links">
            पहले से ही खाता है? <a href="login.html">लॉगिन</a>
        </div>
        <div class="message" id="message"></div>
    </div>
    <script>
        const vendorBtn = document.getElementById('vendorBtn');
        const supplierBtn = document.getElementById('supplierBtn');
        const vendorFields = document.getElementById('vendorFields');
        const supplierFields = document.getElementById('supplierFields');
        const signupForm = document.getElementById('signupForm');
        const messageDiv = document.getElementById('message');
        let currentRole = 'vendor';

        // Mark original required fields
        document.querySelectorAll('#vendorFields [required], #supplierFields [required]').forEach(input => {
            input.setAttribute('data-original-required', 'true');
        });
        function setRequiredFields(visibleFields, hiddenFields) {
            // Remove required from all hidden fields
            hiddenFields.querySelectorAll('[required]').forEach(input => input.required = false);
            // Add required to all visible fields
            visibleFields.querySelectorAll('input,select,textarea').forEach(input => {
                if (input.hasAttribute('data-original-required')) input.required = true;
            });
        }
        vendorBtn.onclick = () => {
            currentRole = 'vendor';
            vendorBtn.classList.add('active');
            supplierBtn.classList.remove('active');
            vendorFields.style.display = '';
            supplierFields.style.display = 'none';
            setRequiredFields(vendorFields, supplierFields);
        };
        supplierBtn.onclick = () => {
            currentRole = 'supplier';
            supplierBtn.classList.add('active');
            vendorBtn.classList.remove('active');
            vendorFields.style.display = 'none';
            supplierFields.style.display = '';
            setRequiredFields(supplierFields, vendorFields);
        };
        // On page load, set required fields correctly
        setRequiredFields(vendorFields, supplierFields);

        signupForm.onsubmit = async (e) => {
            e.preventDefault();
            messageDiv.textContent = 'जमा किया जा रहा है...';
            
            // Get current domain for API calls
            const currentDomain = window.location.origin;
            let url = currentRole === 'vendor'
                ? `${currentDomain}/api/signup/vendor`
                : `${currentDomain}/api/signup/supplier`;
            // Only get fields from the visible section
            let visibleFields = currentRole === 'vendor' ? vendorFields : supplierFields;
            let inputs = visibleFields.querySelectorAll('input,select,textarea');
            let data = {};
            inputs.forEach(input => {
                if (!input.name) return;
                if (input.type === 'file') {
                    if (input.files && input.files.length > 0) data[input.name] = input.files[0].name;
                } else {
                    if (input.value !== "") data[input.name] = input.value;
                }
            });
            try {
                let res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                let result = await res.json();
                if (result.success) {
                    messageDiv.style.color = '#16a34a';
                    messageDiv.textContent = result.message;
                } else {
                    messageDiv.style.color = '#dc2626';
                    messageDiv.textContent = result.message || 'साइनअप विफल।';
                }
            } catch (err) {
                messageDiv.style.color = '#dc2626';
                messageDiv.textContent = 'नेटवर्क त्रुटि।';
            }
        };
    </script>
</body>
</html>
