<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - OverXchange</title>
    <script src="https://accounts.google.com/gsi/client" onload="initGoogleSignIn()" async defer></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="modern-styles.css">
    <style>
        /* Signup Page Specific Styles */
        .signup-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .signup-card {
            background: var(--card-gradient);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-xl);
            padding: 50px 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-medium);
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .signup-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--secondary-gradient);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .signup-card:hover::before {
            transform: scaleX(1);
        }

        .signup-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .signup-logo {
            width: 80px;
            height: 80px;
            background: var(--secondary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            color: var(--white);
            box-shadow: var(--shadow-pink);
        }

        .signup-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .signup-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .user-type-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .user-type-btn {
            flex: 1;
            padding: 15px 20px;
            background: var(--glass-gradient);
            backdrop-filter: var(--glass-blur);
            border: 2px solid var(--glass-border);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            transform-style: preserve-3d;
            text-align: center;
        }

        .user-type-btn.active {
            background: var(--secondary-gradient);
            color: var(--white);
            border-color: var(--pink);
            box-shadow: var(--shadow-pink);
            transform: translateY(-2px);
        }

        .user-type-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            z-index: 2;
        }

        .input-3d {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: var(--glass-gradient);
            backdrop-filter: var(--glass-blur);
            border: 2px solid var(--glass-border);
            border-radius: var(--border-radius);
            font-size: 16px;
            color: var(--text-primary);
            transition: var(--transition);
            transform-style: preserve-3d;
        }

        .input-3d:focus {
            outline: none;
            border-color: var(--pink);
            box-shadow: var(--shadow-pink);
            transform: translateY(-2px);
        }

        .input-3d:focus + .input-icon {
            color: var(--pink);
        }

        .signup-btn {
            width: 100%;
            padding: 18px;
            background: var(--primary-gradient);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            transform-style: preserve-3d;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .signup-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .signup-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: var(--shadow-medium);
        }

        .signup-btn:hover::before {
            left: 100%;
        }

        .signup-btn:active {
            transform: translateY(-2px) scale(1.01);
        }

        .signup-footer {
            text-align: center;
            margin-top: 30px;
        }

        .signup-footer a {
            color: var(--pink);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .signup-footer a:hover {
            color: var(--dark-blue);
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: var(--border-radius);
            background: var(--glass-gradient);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            transform-style: preserve-3d;
        }

        .back-home:hover {
            background: var(--secondary-gradient);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-pink);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 12px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #059669;
            padding: 12px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .signup-card {
                padding: 40px 30px;
                margin: 20px;
            }
            
            .signup-title {
                font-size: 2rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .user-type-selector {
                flex-direction: column;
            }
            
            .back-home {
                top: 20px;
                left: 20px;
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
    </div>

    <!-- Back to Home -->
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <!-- Signup Container -->
    <div class="signup-container">
        <div class="signup-card">
            <div class="signup-header">
                <div class="signup-logo">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="signup-title">Join OverXchange</h1>
                <p class="signup-subtitle">Create your account and start your journey</p>
            </div>

            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>

            <!-- User Type Selector -->
            <div class="user-type-selector">
                <button class="user-type-btn active" data-type="vendor">
                    <i class="fas fa-store"></i> Vendor
                </button>
                <button class="user-type-btn" data-type="supplier">
                    <i class="fas fa-truck"></i> Supplier
                </button>
            </div>

            <form id="signup-form">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="first-name">First Name</label>
                        <div class="input-group">
                            <input type="text" id="first-name" name="first_name" class="input-3d" placeholder="Enter first name" required>
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="last-name">Last Name</label>
                        <div class="input-group">
                            <input type="text" id="last-name" name="last_name" class="input-3d" placeholder="Enter last name" required>
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-group">
                        <input type="email" id="email" name="email" class="input-3d" placeholder="Enter your email" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <div class="input-group">
                        <input type="tel" id="phone" name="phone" class="input-3d" placeholder="Enter phone number" required>
                        <i class="fas fa-phone input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" name="password" class="input-3d" placeholder="Create a password" required>
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                </div>

            <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" id="confirm-password" name="confirm_password" class="input-3d" placeholder="Confirm your password" required>
                        <i class="fas fa-lock input-icon"></i>
                    </div>
            </div>

            <div class="form-group">
                    <label class="form-label" for="address">Address</label>
                    <div class="input-group">
                        <input type="text" id="address" name="address" class="input-3d" placeholder="Enter your address" required>
                        <i class="fas fa-map-marker-alt input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="signup-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div style="text-align: center; margin: 20px 0; color: var(--text-secondary);">OR</div>

            <button type="button" id="google-signin-btn" class="signup-btn google-btn">
                <i class="fab fa-google"></i> Sign Up with Google
            </button>

            <div class="signup-footer">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </div>
    </div>

    <!-- Enhanced Theme Toggle -->
    <button class="theme-toggle" onclick="toggleTheme()">
        <div class="icon-container">
            <i class="fas fa-sun sun-icon"></i>
            <i class="fas fa-moon moon-icon"></i>
        </div>
        <div class="symbol-label">☀️ Light Mode</div>
        <div class="mode-indicator">🌙 Dark Mode</div>
    </button>

    <script>
        // --- Existing scripts from login.html for Google Sign-In ---
        function handleSuccessfulLogin(data) {
            const successMessage = document.getElementById('success-message');
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('user_type', data.user_type);
            localStorage.setItem('user_name', data.name || '');
            localStorage.setItem('token', data.token);

            successMessage.textContent = 'Login successful! Redirecting...';
            successMessage.style.display = 'block';

            setTimeout(() => {
                if (data.user_type === 'vendor') {
                    window.location.href = 'vendor-dashboard.html';
                } else if (data.user_type === 'supplier') {
                    window.location.href = 'supply-dashboard.html';
                } else if (data.user_type === 'admin') {
                    window.location.href = 'admin-license-verification.html';
                } else {
                    window.location.href = 'profile.html';
                }
            }, 1500);
        }

        async function initGoogleSignIn() {
            try {
                const response = await fetch('/api/config/google-client-id');
                const config = await response.json();
                const clientId = config.client_id;

                if (!clientId) {
                    console.error('Google Client ID not found.');
                    document.getElementById('error-message').textContent = 'Google Sign-In is not configured.';
                    document.getElementById('error-message').style.display = 'block';
                    return;
                }

                google.accounts.id.initialize({
                    client_id: clientId,
                    callback: handleCredentialResponse
                });

                document.getElementById('google-signin-btn').addEventListener('click', () => {
                    google.accounts.id.prompt();
                });
            } catch (error) {
                console.error('Error fetching Google Client ID:', error);
                document.getElementById('error-message').textContent = 'Could not initialize Google Sign-In.';
                document.getElementById('error-message').style.display = 'block';
            }
        }

        async function handleCredentialResponse(response) {
            const errorMessage = document.getElementById('error-message');
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    if (data.action === 'select_role') {
                        const params = new URLSearchParams({
                            name: data.name,
                            email: data.email,
                            token: data.google_token
                        });
                        window.location.href = `role_selection.html?${params.toString()}`;
                    } else {
                        handleSuccessfulLogin(data);
                    }
                } else {
                    errorMessage.textContent = data.message || 'Google Sign-In failed.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Error during Google Sign-In. Please try again.';
                errorMessage.style.display = 'block';
            }
        }
        
        // --- Original signup.html scripts ---
        function toggleTheme() {
            // ... (theme toggle logic is duplicated but will work)
        }
        // User Type Selector
        const userTypeBtns = document.querySelectorAll('.user-type-btn');
        let selectedUserType = 'vendor';

        userTypeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                userTypeBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedUserType = this.dataset.type;
            });
        });

        // Signup Form Handling
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            // ... (rest of the original signup form handling)
        });

        // Input focus effects
        document.querySelectorAll('.input-3d').forEach(input => {
            // ... (rest of the original input focus effects)
        });
    </script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
