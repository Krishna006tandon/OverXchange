<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OverXchange - होम</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(90deg, #3730a3 0%, #6366f1 100%);
            box-shadow: 0 8px 32px 0 rgba(99,102,241,0.18);
            border-radius: 0 0 22px 22px;
            backdrop-filter: blur(12px);
            border-bottom: 2px solid #a5b4fc44;
            padding: 0;
            transition: box-shadow 0.2s;
        }
        .navbar-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            height: 72px;
            padding: 0 28px;
        }
        .navbar-logo {
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 1.7em;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            margin-right: 38px;
            gap: 12px;
        }
        .navbar-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px #6366f133;
        }
        .navbar-logo-icon svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.13em;
            margin-right: 8px;
            font-weight: 500;
            padding: 10px 22px;
            border-radius: 10px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.18s;
        }
        .navbar a:hover {
            background: #fff3;
            color: #3730a3;
            box-shadow: 0 2px 8px #6366f133;
            transform: translateY(-2px) scale(1.04);
        }
        .navbar .signup-btn {
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            color: #fff;
            font-weight: 800;
            font-size: 1.18em;
            margin-right: 0;
            box-shadow: 0 4px 16px #6366f144;
            border: none;
            border-radius: 14px;
            padding: 12px 32px;
            letter-spacing: 0.5px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.18s;
        }
        .navbar .signup-btn:hover {
            background: linear-gradient(90deg, #818cf8 0%, #6366f1 100%);
            color: #fff;
            box-shadow: 0 6px 24px #6366f155;
            transform: translateY(-3px) scale(1.07);
        }
        .hero {
            max-width: 700px;
            margin: 80px auto 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            box-shadow: 0 4px 24px #6366f11a;
            padding: 48px 36px 40px 36px;
            text-align: center;
        }
        .hero h1 {
            color: #3730a3;
            font-size: 2.7em;
            margin-bottom: 18px;
            font-weight: 700;
        }
        .hero p {
            color: #4b5563;
            font-size: 1.2em;
            margin-bottom: 32px;
        }
        .cta-btn {
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 16px 36px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px #6366f133;
            transition: background 0.2s, transform 0.2s;
        }
        .cta-btn:hover {
            background: linear-gradient(90deg, #818cf8 0%, #6366f1 100%);
            transform: translateY(-2px) scale(1.03);
        }
        @media (max-width: 700px) {
            .hero { padding: 28px 8px 24px 8px; }
            .navbar-container { padding: 0 8px; }
            .navbar-logo { font-size: 1.1em; }
            .navbar-logo-icon { width: 26px; height: 26px; }
            .navbar-logo-icon svg { width: 15px; height: 15px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="#" class="navbar-logo">
                <span class="navbar-logo-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 13l3 3 7-7" stroke="#fff" stroke-width="2" fill="none"/></svg>
                </span>
                OverXchange
            </a>
            <div class="navbar-links" id="navbar-links">
                <a href="index.html">होम</a>
                <a href="login.html" id="login-link">लॉगिन</a>
                <a href="signup.html" class="signup-btn" id="signup-link">साइनअप</a>
                <a href="profile.html" id="profile-link" style="display:none;">प्रोफाइल</a>
                <a href="vendor-dashboard.html" id="vendor-dashboard-link" style="display:none;">डैशबोर्ड</a>
                <button id="logout-btn" style="display:none; background:linear-gradient(90deg,#6366f1 0%,#818cf8 100%);color:#fff;font-weight:800;font-size:1.13em;border:none;border-radius:10px;padding:10px 22px;margin-left:8px;cursor:pointer;">लॉगआउट</button>
            </div>
        </div>
    </nav>
    <section class="hero">
        <h1 data-translate="welcome_message">OverXchange में आपका स्वागत है</h1>
        <p data-translate="welcome_description">भारतीय स्ट्रीट फूड वेंडर्स को विश्वसनीय और सस्ते आपूर्तिकर्ताओं से कच्चा माल प्राप्त करने में सशक्त बनाना।<br>वेंडर्स को आपूर्तिकर्ताओं से डिजिटल रूप से जोड़ना</p>
        <button class="cta-btn" data-translate="get_started">शुरू करें</button>
    </section>
    <script>
    function updateNavbar() {
        const isLoggedIn = localStorage.getItem('user_type') && localStorage.getItem('user_id');
        const userType = localStorage.getItem('user_type');
        
        document.getElementById('login-link').style.display = isLoggedIn ? 'none' : 'inline-block';
        document.getElementById('signup-link').style.display = isLoggedIn ? 'none' : 'inline-block';
        document.getElementById('profile-link').style.display = isLoggedIn ? 'inline-block' : 'none';
        document.getElementById('logout-btn').style.display = isLoggedIn ? 'inline-block' : 'none';
        
        // Show dashboard link only for vendors
        document.getElementById('vendor-dashboard-link').style.display = (isLoggedIn && userType === 'vendor') ? 'inline-block' : 'none';
    }
    document.getElementById('logout-btn').addEventListener('click', function() {
        localStorage.removeItem('user_type');
        localStorage.removeItem('user_id');
        updateNavbar();
        window.location.href = 'index.html';
    });
    document.addEventListener('DOMContentLoaded', updateNavbar);
    </script>
</body>
</html>
