<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OverXchange - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(90deg, #3730a3 0%, #6366f1 100%);
            box-shadow: 0 4px 24px #6366f133;
            border-radius: 0 0 18px 18px;
            backdrop-filter: blur(6px);
            padding: 0;
            transition: box-shadow 0.2s;
        }
        .navbar-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            height: 64px;
            padding: 0 18px;
        }
        .navbar-logo {
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 1.5em;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            margin-right: 32px;
            gap: 10px;
        }
        .navbar-logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px #6366f133;
        }
        .navbar-logo-icon svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }
        .navbar-links {
            display: flex;
            align-items: center;
        }
        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.1em;
            margin-right: 24px;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .navbar a:hover {
            background: #fff3;
            color: #3730a3;
            box-shadow: 0 2px 8px #6366f133;
        }
        .hero {
            max-width: 700px;
            margin: 80px auto 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            box-shadow: 0 4px 24px #6366f11a;
            padding: 48px 36px 40px 36px;
            text-align: center;
        }
        .hero h1 {
            color: #3730a3;
            font-size: 2.7em;
            margin-bottom: 18px;
            font-weight: 700;
        }
        .hero p {
            color: #4b5563;
            font-size: 1.2em;
            margin-bottom: 32px;
        }
        .cta-btn {
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 16px 36px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px #6366f133;
            transition: background 0.2s, transform 0.2s;
        }
        .cta-btn:hover {
            background: linear-gradient(90deg, #818cf8 0%, #6366f1 100%);
            transform: translateY(-2px) scale(1.03);
        }
        @media (max-width: 700px) {
            .hero { padding: 28px 8px 24px 8px; }
            .navbar-container { padding: 0 8px; }
            .navbar-logo { font-size: 1.1em; }
            .navbar-logo-icon { width: 26px; height: 26px; }
            .navbar-logo-icon svg { width: 15px; height: 15px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="#" class="navbar-logo">
                <span class="navbar-logo-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 13l3 3 7-7" stroke="#fff" stroke-width="2" fill="none"/></svg>
                </span>
                OverXchange
            </a>
            <div class="navbar-links">
                <a href="index.html">Home</a>
            </div>
        </div>
    </nav>
    <section class="hero">
        <h1>Welcome to OverXchange</h1>
        <p>Empowering Indian street food vendors to source raw materials from trusted and affordable suppliers.<br>Connecting Vendors to Suppliers Digitally</p>
        <button class="cta-btn">Get Started</button>
    </section>
</body>
</html>
