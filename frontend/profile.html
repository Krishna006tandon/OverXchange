<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - OverXchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%);
            margin: 0;
            min-height: 100vh;
        }
        .profile-container {
            max-width: 700px;
            margin: 60px auto 0 auto;
            background: rgba(255,255,255,0.98);
            border-radius: 32px;
            box-shadow: 0 12px 48px #6366f144, 0 2px 0 #a5b4fc44;
            padding: 56px 48px 40px 48px;
            text-align: center;
            border: 2.5px solid #a5b4fc44;
            position: relative;
            animation: fadeIn 0.7s cubic-bezier(.39,.575,.56,1.000);
        }
        .profile-avatar {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
            box-shadow: 0 2px 12px #6366f133;
            border: 5px solid #fff;
            position: relative;
        }
        .profile-avatar svg {
            width: 70px;
            height: 70px;
            fill: #fff;
        }
        .profile-title {
            color: #3730a3;
            margin-bottom: 8px;
            font-size: 2.3em;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .profile-role {
            color: #6366f1;
            font-size: 1.18em;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .profile-form {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-top: 18px;
        }
        #profile-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px 36px;
            margin-bottom: 18px;
        }
        @media (max-width: 900px) {
            .profile-container { padding: 24px 2vw 24px 2vw; }
            #profile-fields { grid-template-columns: 1fr; gap: 24px 0; }
        }
        .profile-field-box {
            background: #f3f4f6;
            border-radius: 16px;
            box-shadow: 0 2px 12px #6366f122;
            padding: 22px 24px 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: box-shadow 0.18s;
        }
        .profile-field-box:focus-within {
            box-shadow: 0 4px 24px #6366f144;
        }
        .profile-form label {
            font-weight: 700;
            color: #3730a3;
            text-align: left;
            margin-bottom: 8px;
            font-size: 1.08em;
        }
        .profile-form input, .profile-form textarea {
            width: 100%;
            padding: 14px 14px;
            border-radius: 10px;
            border: 1.5px solid #c7d2fe;
            font-size: 1.13em;
            background: #fff;
            transition: border 0.2s, box-shadow 0.2s;
            resize: none;
            margin-bottom: 0;
        }
        .profile-form input:focus, .profile-form textarea:focus {
            border: 1.5px solid #6366f1;
            box-shadow: 0 2px 8px #6366f122;
            outline: none;
        }
        .profile-form img {
            max-width: 180px;
            max-height: 120px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #6366f122;
            margin-bottom: 8px;
        }
        .profile-btns {
            display: flex;
            gap: 18px;
            justify-content: center;
            margin-top: 18px;
        }
        .btn {
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 15px 38px;
            font-size: 1.18em;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px #6366f144;
            transition: background 0.2s, transform 0.18s;
        }
        .btn[disabled] {
            background: #a5b4fc;
            cursor: not-allowed;
        }
        .btn:hover:not([disabled]) {
            background: linear-gradient(90deg, #818cf8 0%, #6366f1 100%);
            transform: translateY(-2px) scale(1.04);
        }
        #profile-message {
            color: green;
            margin-top: 18px;
            font-weight: 600;
            min-height: 24px;
            font-size: 1.1em;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-avatar">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="6.5"/><path d="M4 22c0-4.5 4.5-8 8-8s8 3.5 8 8"/></svg>
        </div>
        <div class="profile-title">Your Profile</div>
        <div class="profile-role" id="profile-role"></div>
        <form id="profile-form" class="profile-form">
            <div id="profile-fields"></div>
            <div class="profile-btns">
                <button type="button" id="edit-btn" class="btn">Edit</button>
                <button type="submit" id="save-btn" class="btn" style="display:none;">Save</button>
            </div>
        </form>
        <div id="profile-message"></div>
    </div>
    <script>
    // Get user_type and user_id from localStorage (set after login)
    const user_type = localStorage.getItem('user_type');
    const user_id = localStorage.getItem('user_id');
    if (!user_type || !user_id) {
        document.body.innerHTML = '<div class="profile-container"><h2>Not logged in</h2><p>Please log in to view your profile.</p></div>';
        throw new Error('Not logged in');
    }
    const apiUrl = `${window.location.origin}/api/profile/${user_type}/${user_id}`;
    const editableFields = ['name', 'email', 'bio', 'shop_name', 'company_name', 'business_name', 'food_beverage_details', 'business_address', 'pincode', 'phone', 'gstin', 'preferred_categories', 'product_categories', 'warehouse_address', 'business_proof', 'moq', 'logistics_options'];
    const fieldLabels = {
        name: 'Name',
        email: 'Email',
        bio: 'Bio',
        shop_name: 'Shop Name',
        company_name: 'Company Name',
        business_name: 'Business Name',
        food_beverage_details: 'Food & Beverage Details',
        business_address: 'Business Address',
        pincode: 'Pincode',
        phone: 'Phone',
        gstin: 'GSTIN',
        preferred_categories: 'Preferred Product Categories',
        product_categories: 'Product Categories Supplied',
        warehouse_address: 'Warehouse Address',
        business_proof: 'Business Proof',
        moq: 'Minimum Order Quantity (MOQ)',
        logistics_options: 'Available Logistics Options',
        invite_code: 'Invite Code',
        business_logo: 'Business Logo',
        user_type: 'Account Type',
        user_id: 'User ID',
        _id: 'User ID',
    };
    let profileData = {};
    let isEditable = false;
    // Elements
    const fieldsDiv = document.getElementById('profile-fields');
    const editBtn = document.getElementById('edit-btn');
    const saveBtn = document.getElementById('save-btn');
    const messageDiv = document.getElementById('profile-message');
    const roleDiv = document.getElementById('profile-role');
    // Render profile fields
    function renderFields(data, editable) {
        fieldsDiv.innerHTML = '';
        Object.entries(data).forEach(([key, value]) => {
            if (key === 'password' || key === 'user_id' || key === '_id') return;
            if (key === 'user_type') {
                roleDiv.textContent = value.charAt(0).toUpperCase() + value.slice(1);
            }
            let label = fieldLabels[key] || key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            let inputType = (key === 'bio' || key === 'food_beverage_details') ? 'textarea' : 'text';
            let isFieldEditable = editable && editableFields.includes(key);
            let fieldHtml = '';
            if (inputType === 'textarea') {
                fieldHtml = `<div class="profile-field-box"><label>${label}</label><textarea name="${key}" id="profile-${key}" ${isFieldEditable ? '' : 'disabled'} rows="3">${value || ''}</textarea></div>`;
            } else if (key === 'business_logo' && value) {
                fieldHtml = `<div class="profile-field-box"><label>${label}</label><br><img src="${value}" alt="Business Logo"></div>`;
            } else {
                fieldHtml = `<div class="profile-field-box"><label>${label}</label><input type="text" name="${key}" id="profile-${key}" value="${value || ''}" ${isFieldEditable ? '' : 'disabled'}></div>`;
            }
            fieldsDiv.innerHTML += fieldHtml;
        });
    }
    // Load profile
    function loadProfile() {
        fetch(apiUrl)
            .then(res => {
                if (!res.ok) throw new Error('Profile not found');
                return res.json();
            })
            .then(data => {
                profileData = data;
                renderFields(profileData, false);
                setEditable(false);
                messageDiv.textContent = '';
            })
            .catch(err => {
                messageDiv.style.color = 'red';
                messageDiv.textContent = err.message;
            });
    }
    // Edit/Save logic
    function setEditable(editable) {
        isEditable = editable;
        editBtn.style.display = editable ? 'none' : 'inline-block';
        saveBtn.style.display = editable ? 'inline-block' : 'none';
        renderFields(profileData, editable);
    }
    editBtn.addEventListener('click', function() {
        setEditable(true);
    });
    document.getElementById('profile-form').addEventListener('submit', function(e) {
        e.preventDefault();
        // Only send editable fields
        const data = {};
        editableFields.forEach(key => {
            const el = document.getElementById('profile-' + key);
            if (el) data[key] = el.value;
        });
        fetch(apiUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(resp => {
            setEditable(false);
            messageDiv.style.color = 'green';
            messageDiv.textContent = resp.message;
            loadProfile();
        })
        .catch(err => {
            messageDiv.style.color = 'red';
            messageDiv.textContent = err.message;
        });
    });
    // On page load
    loadProfile();
    </script>
</body>
</html>
