<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Settings - OverXchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="modern-styles.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <!-- Sidebar content from supply-dashboard.html -->
        </div>
        <div class="main-content">
            <div class="page-header">
                <h1 class="page-title">Settings</h1>
            </div>
            <div class="settings-container">
                <div class="settings-section">
                    <div class="section-header">
                        <h2 class="section-title"><i class="fas fa-user-edit"></i> Edit Profile</h2>
                    </div>
                    <div class="settings-content">
                        <form id="settings-form">
                            <div class="form-group">
                                <label for="businessName">Business Name</label>
                                <input type="text" id="businessName" name="name">
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="tel" id="phone" name="phone">
                            </div>
                            <div class="form-group">
                                <label for="warehouseAddress">Warehouse Address</label>
                                <input type="text" id="warehouseAddress" name="warehouse_address">
                            </div>
                            <div class="form-group">
                                <label for="upiId">UPI ID</label>
                                <input type="text" id="upiId" name="upi_id">
                            </div>
                            <div class="modal-actions">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const authToken = localStorage.getItem('authToken');
            const userId = localStorage.getItem('user_id');
            const userType = localStorage.getItem('user_type');

            if (!authToken || !userId || userType !== 'supplier') {
                window.location.href = 'login.html';
                return;
            }

            // Fetch current user data
            fetch(`/api/profile/supplier/${userId}`, {
                headers: {
                    'Authorization': `Bearer ${authToken}`
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.user_id) {
                    document.getElementById('businessName').value = data.name || '';
                    document.getElementById('phone').value = data.phone || '';
                    document.getElementById('warehouseAddress').value = data.warehouse_address || '';
                    document.getElementById('upiId').value = data.upi_id || '';
                }
            });

            // Handle form submission
            document.getElementById('settings-form').addEventListener('submit', function(e) {
                e.preventDefault();

                const updatedData = {
                    name: document.getElementById('businessName').value,
                    phone: document.getElementById('phone').value,
                    warehouse_address: document.getElementById('warehouseAddress').value,
                    upi_id: document.getElementById('upiId').value
                };

                fetch(`/api/profile/supplier/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(updatedData)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Settings updated successfully!');
                    } else {
                        alert('Error updating settings: ' + (data.message || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error updating settings:', error);
                    alert('An error occurred while updating settings.');
                });
            });
        });
    </script>
</body>
</html>
