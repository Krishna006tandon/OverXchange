<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Registration - OverXchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="modern-styles.css">
    <style>
        .role-selection-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .role-card {
            background: var(--card-gradient);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-xl);
            padding: 50px 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow-medium);
            text-align: center;
        }
        .role-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 15px;
        }
        .role-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .role-options {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .role-option {
            padding: 30px;
            border-radius: var(--border-radius);
            border: 2px solid var(--glass-border);
            cursor: pointer;
            transition: var(--transition);
            width: 200px;
        }
        .role-option:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-pink);
            border-color: var(--pink);
        }
        .role-option i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--pink);
        }
        .role-option h3 {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .error-message {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="floating-shapes"></div>
    </div>
    <div class="role-selection-container">
        <div class="role-card">
            <h1 class="role-title">Welcome, <span id="user-name"></span>!</h1>
            <p class="role-subtitle">Just one more step. Please select your role on OverXchange.</p>
            
            <div class="role-options">
                <div class="role-option" id="select-vendor">
                    <i class="fas fa-store"></i>
                    <h3>Vendor</h3>
                    <p>I want to buy or trade goods.</p>
                </div>
                <div class="role-option" id="select-supplier">
                    <i class="fas fa-truck-loading"></i>
                    <h3>Supplier</h3>
                    <p>I want to supply/sell goods.</p>
                </div>
            </div>
            <div class="alert alert-danger error-message" id="error-message"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('name');
            const email = params.get('email');
            const token = params.get('token');

            if (!name || !email || !token) {
                document.getElementById('error-message').textContent = 'Invalid registration data. Please try signing up again.';
                document.getElementById('error-message').style.display = 'block';
                return;
            }

            document.getElementById('user-name').textContent = name;

            document.getElementById('select-vendor').addEventListener('click', () => completeRegistration('vendor'));
            document.getElementById('select-supplier').addEventListener('click', () => completeRegistration('supplier'));

            async function completeRegistration(role) {
                try {
                    const response = await fetch('/api/auth/google/complete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, role })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        // Store user info and redirect
                        localStorage.setItem('user_id', data.user_id);
                        localStorage.setItem('user_type', data.user_type);
                        localStorage.setItem('user_name', data.name || '');
                        localStorage.setItem('token', data.token);

                        // Redirect to the appropriate dashboard
                        if (data.user_type === 'vendor') {
                            window.location.href = 'vendor-dashboard.html';
                        } else if (data.user_type === 'supplier') {
                            window.location.href = 'supply-dashboard.html';
                        } else {
                            window.location.href = 'profile.html';
                        }
                    } else {
                        document.getElementById('error-message').textContent = data.message || 'Failed to complete registration.';
                        document.getElementById('error-message').style.display = 'block';
                    }
                } catch (error) {
                    document.getElementById('error-message').textContent = 'An error occurred. Please try again.';
                    document.getElementById('error-message').style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
