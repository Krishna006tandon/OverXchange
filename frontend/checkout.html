<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - OverXchange</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --text-color: #2d3748;
            --text-light: #718096;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .header {
            background: var(--card-bg);
            box-shadow: var(--shadow);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo span {
            color: var(--secondary-color);
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .main-content {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--text-color);
        }

        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
            align-items: flex-start;
        }

        .checkout-form {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 2.5rem;
        }

        .form-section {
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-light);
        }

        input, textarea, select {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .order-summary {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 2rem;
            position: sticky;
            top: 100px;
        }

        .summary-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .order-items .order-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
        }

        .order-item-details h4 {
            font-weight: 600;
        }
        .order-item-details p {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .order-item-price {
            margin-left: auto;
            font-weight: 600;
        }

        .summary-details {
            margin-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            color: var(--text-light);
        }

        .summary-row span:last-child {
            font-weight: 600;
            color: var(--text-color);
        }

        .summary-row.total {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-color);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .place-order-btn {
            width: 100%;
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
        }

        .place-order-btn:hover {
            box-shadow: var(--shadow-lg);
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
        }
        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 992px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 576px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .coupon-section {
            margin-top: 1rem;
        }

        .coupon-dropdown {
            min-width: 220px;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-color);
            background-color: #ffffff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .coupon-dropdown:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .coupon-dropdown.empty {
            color: var(--text-light);
        }

        .coupon-input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .coupon-input-group > * {
            flex: 1;
        }

        .coupon-select-wrapper {
            flex: 0 0 230px;
            position: relative;
        }

        .coupon-select-wrapper::after {
            content: '\f0d7';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-light);
        }

        .coupon-select-wrapper select {
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        .apply-coupon-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .apply-coupon-btn:hover {
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }

        .apply-coupon-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .coupon-message {
            font-size: 0.9rem;
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
        }

        .coupon-message.success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .coupon-message.error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .applied-coupon-display {
            margin-top: 1rem;
            padding: 1rem;
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 8px;
        }

        .applied-coupon-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #065f46;
        }

        .applied-coupon-info i {
            color: var(--success-color);
            margin-right: 0.5rem;
        }

        .remove-coupon-btn {
            background: transparent;
            border: 1px solid #86efac;
            color: #065f46;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .remove-coupon-btn:hover {
            background: #dcfce7;
            border-color: var(--success-color);
        }

    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <svg class="logo-svg" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L8 12v1c0 1.1.9 2 2 2h2v2.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                Over<span>Xchange</span>
            </div>
            <a href="cart.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Back to Cart
            </a>
        </div>
    </header>

    <main class="main-content">
        <h1 class="page-title">Checkout</h1>

        <div id="alert-container"></div>

        <div class="checkout-container">
            <div class="checkout-form">
                <form id="checkoutForm">
                    <div class="form-section">
                        <h2 class="section-title"><i class="fas fa-user-circle"></i>Contact Information</h2>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required placeholder="you@example.com">
                        </div>
                    </div>

                    <div class="form-section">
                        <h2 class="section-title"><i class="fas fa-truck"></i>Shipping Address</h2>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name</label>
                                <input type="text" id="firstName" name="firstName" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name</label>
                                <input type="text" id="lastName" name="lastName" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="addressLine1">Address</label>
                            <input type="text" id="addressLine1" name="addressLine1" required placeholder="1234 Main St">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City</label>
                                <input type="text" id="city" name="city" required>
                            </div>
                            <div class="form-group">
                                <label for="state">State / Province</label>
                                <input type="text" id="state" name="state" required>
                            </div>
                            <div class="form-group">
                                <label for="pincode">ZIP / Postal Code</label>
                                <input type="text" id="pincode" name="pincode" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2 class="section-title"><i class="fas fa-tag"></i>Coupon Code</h2>
                        <div class="coupon-section">
                            <div class="coupon-input-group">
                                <div id="couponDropdownWrapper" class="coupon-select-wrapper" style="display: none;">
                                    <select id="couponDropdown" class="coupon-dropdown empty" onchange="handleCouponSelect(this.value)">
                                        <option value="">Select an active coupon</option>
                                    </select>
                                </div>
                                <input type="text" id="couponCode" placeholder="Enter coupon code" style="flex: 1;">
                                <button type="button" id="applyCouponBtn" onclick="applyCoupon()" class="apply-coupon-btn">
                                    Apply
                                </button>
                            </div>
                            <div id="couponMessage" class="coupon-message"></div>
                            <div id="appliedCouponDisplay" class="applied-coupon-display" style="display: none;">
                                <div class="applied-coupon-info">
                                    <span><i class="fas fa-check-circle"></i> <strong id="appliedCouponCode"></strong> applied</span>
                                    <button type="button" onclick="removeCoupon()" class="remove-coupon-btn">
                                        <i class="fas fa-times"></i> Remove
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2 class="section-title"><i class="fas fa-credit-card"></i>Payment</h2>
                        <p>All transactions are secure and encrypted.</p>
                        <!-- Payment fields would go here -->
                    </div>
                </form>
            </div>

            <div class="order-summary">
                <h2 class="summary-title">Order Summary</h2>
                <div class="order-items" id="orderItems"></div>
                <div class="summary-details">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotal">₹0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span id="shippingCost">₹50.00</span>
                    </div>
                    <div class="summary-row">
                        <span>GST (18%)</span>
                        <span id="taxAmount">₹0.00</span>
                    </div>
                    <div class="summary-row" id="discountRow" style="display: none;">
                        <span>Discount</span>
                        <span id="discountAmount">- ₹0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="totalAmount">₹0.00</span>
                    </div>
                </div>
                <button class="place-order-btn" id="placeOrderBtn" onclick="placeOrder()">
                    Place Order
                </button>
            </div>
        </div>
    </main>

    <script>
        let appliedCoupon = null;
        let availableCoupons = [];

        document.addEventListener('DOMContentLoaded', function() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                window.location.href = 'cart.html';
                return;
            }
            const storedCoupon = localStorage.getItem('appliedCoupon');
            if (storedCoupon) {
                appliedCoupon = JSON.parse(storedCoupon);
                displayAppliedCoupon();
            }
            renderOrderItems(cart);
            updateOrderSummary(cart);
            initializeCouponDropdown(cart);
        });

        function renderOrderItems(cart) {
            const orderItemsContainer = document.getElementById('orderItems');
            let itemsHTML = '';
            cart.forEach(item => {
                const imageUrl = item.imageUrl || `https://via.placeholder.com/50/f0f2f5/a0aec0?text=No+Image`;
                itemsHTML += `
                    <div class="order-item">
                        <div class="order-item-img">
                            <img src="${imageUrl}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div class="order-item-details">
                            <h4>${item.name}</h4>
                            <p>Qty: ${item.quantity}</p>
                        </div>
                        <div class="order-item-price">₹${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                `;
            });
            orderItemsContainer.innerHTML = itemsHTML;
        }

        function updateOrderSummary(cart) {
            const subtotal = cart.reduce((total, item) => total + (item.price * item.quantity), 0);
            const shipping = 50; // Flat rate for now
            const tax = subtotal * 0.18;
            let discount = 0;

            if (appliedCoupon) {
                if (appliedCoupon.discount_type === 'percentage') {
                    discount = (subtotal * appliedCoupon.discount_value) / 100;
                    if (appliedCoupon.max_discount) {
                        discount = Math.min(discount, appliedCoupon.max_discount);
                    }
                } else {
                    discount = appliedCoupon.discount_value;
                }
                document.getElementById('discountRow').style.display = 'flex';
                document.getElementById('discountAmount').textContent = `- ₹${discount.toFixed(2)}`;
            } else {
                document.getElementById('discountRow').style.display = 'none';
            }

            const total = subtotal + shipping + tax - discount;

            document.getElementById('subtotal').textContent = `₹${subtotal.toFixed(2)}`;
            document.getElementById('shippingCost').textContent = `₹${shipping.toFixed(2)}`;
            document.getElementById('taxAmount').textContent = `₹${tax.toFixed(2)}`;
            document.getElementById('totalAmount').textContent = `₹${total.toFixed(2)}`;
        }

        async function placeOrder() {
            const form = document.getElementById('checkoutForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const placeOrderBtn = document.getElementById('placeOrderBtn');
            placeOrderBtn.disabled = true;
            placeOrderBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const authToken = localStorage.getItem('token'); // Assumes token is stored in localStorage

            if (!authToken) {
                showAlert('You must be logged in to place an order.', 'danger');
                placeOrderBtn.disabled = false;
                placeOrderBtn.textContent = 'Place Order';
                // Optionally redirect to login page
                return;
            }

            const subtotal = cart.reduce((total, item) => total + (item.price * item.quantity), 0);
            const shipping = 50; // Flat rate
            const tax = subtotal * 0.18;
            let discount = 0;
            let couponCode = null;

            if (appliedCoupon) {
                if (appliedCoupon.discount_type === 'percentage') {
                    discount = (subtotal * appliedCoupon.discount_value) / 100;
                    if (appliedCoupon.max_discount) {
                        discount = Math.min(discount, appliedCoupon.max_discount);
                    }
                } else {
                    discount = appliedCoupon.discount_value;
                }
                couponCode = appliedCoupon.code;
            }

            const total = subtotal + shipping + tax - discount;

            const orderData = {
                shipping_address: {
                    email: document.getElementById('email').value,
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    addressLine1: document.getElementById('addressLine1').value,
                    city: document.getElementById('city').value,
                    state: document.getElementById('state').value,
                    pincode: document.getElementById('pincode').value,
                },
                items: cart,
                subtotal: subtotal,
                shipping_cost: shipping,
                tax: tax,
                total_amount: total,
                discount: discount,
                coupon_code: couponCode,
            };

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.removeItem('cart');
                    localStorage.removeItem('appliedCoupon'); // Clear coupon as well
                    showAlert('Order placed successfully! You will be redirected shortly.', 'success');
                    setTimeout(() => window.location.href = 'vendor-dashboard.html', 3000);
                } else {
                    showAlert(result.message || 'Failed to place order. Please try again.', 'danger');
                    placeOrderBtn.disabled = false;
                    placeOrderBtn.textContent = 'Place Order';
                }
            } catch (error) {
                showAlert('An error occurred while placing the order. Please check your connection.', 'danger');
                placeOrderBtn.disabled = false;
                placeOrderBtn.textContent = 'Place Order';
            }
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertContainer.appendChild(alertDiv);
            window.scrollTo(0, 0);
        }

        async function initializeCouponDropdown(cart) {
            const dropdownWrapper = document.getElementById('couponDropdownWrapper');
            const dropdown = document.getElementById('couponDropdown');

            if (!dropdownWrapper || !dropdown) return;

            const couponMessage = document.getElementById('couponMessage');

            const cartHasItems = cart.length > 0;
            if (!cartHasItems) {
                dropdownWrapper.style.display = 'none';
                return;
            }

            const firstSupplierId = cart[0].supplierId;
            const allSameSupplier = cart.every(item => item.supplierId === firstSupplierId);

            if (!allSameSupplier) {
                dropdownWrapper.style.display = 'none';
                couponMessage.textContent = 'Coupons only apply to orders from a single supplier.';
                couponMessage.className = 'coupon-message error';
                return;
            }

            dropdownWrapper.style.display = 'block';
            dropdown.disabled = true;
            dropdown.classList.add('empty');
            dropdown.innerHTML = '<option value="">Loading active coupons...</option>';

            await loadAvailableCoupons(firstSupplierId, cart);
        }

        async function loadAvailableCoupons(supplierId, cart) {
            const dropdownWrapper = document.getElementById('couponDropdownWrapper');
            const dropdown = document.getElementById('couponDropdown');
            const couponMessage = document.getElementById('couponMessage');

            if (!dropdownWrapper || !dropdown) return;

            const subtotal = cart.reduce((total, item) => total + (item.price * item.quantity), 0);

            try {
                const queryParams = new URLSearchParams({ supplier_id: supplierId });
                const authToken = localStorage.getItem('token');

                const response = await fetch(`/api/coupons?${queryParams.toString()}`, {
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });

                const result = await response.json();

                if (!result.success || !Array.isArray(result.coupons)) {
                    dropdown.innerHTML = '<option value="">No active coupons available</option>';
                    dropdown.disabled = true;
                    dropdown.classList.add('empty');
                    availableCoupons = [];
                    return;
                }

                const now = new Date();
                availableCoupons = result.coupons.filter(coupon => {
                    if (coupon.status !== 'active') return false;

                    const validUntilRaw = coupon.valid_until;
                    let validUntil = null;

                    if (validUntilRaw) {
                        if (typeof validUntilRaw === 'string') {
                            validUntil = new Date(validUntilRaw);
                        } else if (validUntilRaw.$date) {
                            validUntil = new Date(validUntilRaw.$date);
                        } else {
                            validUntil = new Date(validUntilRaw);
                        }
                        if (isNaN(validUntil.getTime())) {
                            validUntil = null;
                        }
                    }

                    if (validUntil && validUntil < now) return false;

                    const usageLimit = Number(coupon.usage_limit || 0);
                    const usedCount = Number(coupon.used_count || 0);
                    if (usageLimit && usedCount >= usageLimit) return false;

                    const minOrderAmount = Number(coupon.min_order_amount || 0);
                    if (subtotal < minOrderAmount) return false;

                    return true;
                });

                if (availableCoupons.length === 0) {
                    dropdown.innerHTML = '<option value="">No active coupons available</option>';
                    dropdown.disabled = true;
                    dropdown.classList.add('empty');
                    return;
                }

                dropdown.disabled = false;
                dropdown.classList.remove('empty');
                dropdown.innerHTML = '<option value="">Select an active coupon</option>';

                availableCoupons.forEach(coupon => {
                    const option = document.createElement('option');
                    option.value = coupon.code;
                    option.textContent = `${coupon.code} — ${coupon.title}`;
                    dropdown.appendChild(option);
                });

                updateCouponDropdownSelection();
                couponMessage.textContent = '';
                couponMessage.className = 'coupon-message';
            } catch (error) {
                dropdown.innerHTML = '<option value="">Unable to load coupons</option>';
                dropdown.disabled = true;
                dropdown.classList.add('empty');
                console.error('Failed to load coupons:', error);
            }
        }

        function handleCouponSelect(couponCode) {
            const input = document.getElementById('couponCode');
            const messageEl = document.getElementById('couponMessage');

            if (!couponCode) {
                input.value = '';
                messageEl.textContent = '';
                messageEl.className = 'coupon-message';
                return;
            }

            input.value = couponCode;
            applyCoupon();
        }

        async function applyCoupon() {
            const couponCode = document.getElementById('couponCode').value.trim().toUpperCase();
            const messageEl = document.getElementById('couponMessage');
            const applyBtn = document.getElementById('applyCouponBtn');
            
            if (!couponCode) {
                messageEl.textContent = 'Please enter a coupon code.';
                messageEl.className = 'coupon-message error';
                return;
            }

            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                messageEl.textContent = 'Your cart is empty.';
                messageEl.className = 'coupon-message error';
                return;
            }

            // Check if all items are from the same supplier
            const firstSupplierId = cart[0].supplierId;
            const allSameSupplier = cart.every(item => item.supplierId === firstSupplierId);

            if (!allSameSupplier) {
                messageEl.textContent = 'Coupons only apply to orders from a single supplier.';
                messageEl.className = 'coupon-message error';
                appliedCoupon = null;
                displayAppliedCoupon();
                updateOrderSummary(cart);
                return;
            }

            const subtotal = cart.reduce((total, item) => total + (item.price * item.quantity), 0);

            applyBtn.disabled = true;
            applyBtn.textContent = 'Applying...';

            try {
                const response = await fetch(`/api/coupons/validate/${couponCode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        supplier_id: firstSupplierId,
                        order_amount: subtotal
                    })
                });

                const result = await response.json();

                if (result.success) {
                    messageEl.textContent = `Coupon '${result.coupon.code}' applied successfully!`;
                    messageEl.className = 'coupon-message success';
                    appliedCoupon = result.coupon;
                    localStorage.setItem('appliedCoupon', JSON.stringify(appliedCoupon));
                    displayAppliedCoupon();
                    document.getElementById('couponCode').value = '';
                } else {
                    messageEl.textContent = result.message || 'Invalid coupon code.';
                    messageEl.className = 'coupon-message error';
                    appliedCoupon = null;
                    displayAppliedCoupon();
                    updateCouponDropdownSelection();
                }
            } catch (err) {
                messageEl.textContent = 'Could not validate coupon. Please try again.';
                messageEl.className = 'coupon-message error';
                appliedCoupon = null;
                displayAppliedCoupon();
                updateCouponDropdownSelection();
            } finally {
                applyBtn.disabled = false;
                applyBtn.textContent = 'Apply';
            }
            
            updateOrderSummary(cart);
        }

        function removeCoupon() {
            appliedCoupon = null;
            localStorage.removeItem('appliedCoupon');
            displayAppliedCoupon();
            document.getElementById('couponMessage').textContent = '';
            document.getElementById('couponMessage').className = 'coupon-message';
            updateCouponDropdownSelection();
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            updateOrderSummary(cart);
        }

        function displayAppliedCoupon() {
            const appliedCouponDisplay = document.getElementById('appliedCouponDisplay');
            const appliedCouponCode = document.getElementById('appliedCouponCode');
            
            if (appliedCoupon) {
                appliedCouponDisplay.style.display = 'block';
                appliedCouponCode.textContent = appliedCoupon.code;
            } else {
                appliedCouponDisplay.style.display = 'none';
            }
        }

        function updateCouponDropdownSelection() {
            const dropdown = document.getElementById('couponDropdown');
            if (!dropdown) return;

            if (!availableCoupons || availableCoupons.length === 0) {
                dropdown.value = '';
                dropdown.classList.add('empty');
                return;
            }

            if (appliedCoupon) {
                const matchedCoupon = availableCoupons.find(coupon => coupon.code === appliedCoupon.code);
                dropdown.value = matchedCoupon ? matchedCoupon.code : '';
                dropdown.classList.toggle('empty', !matchedCoupon);
            } else {
                dropdown.value = '';
                dropdown.classList.add('empty');
            }
        }

        // Allow Enter key to apply coupon
        document.addEventListener('DOMContentLoaded', function() {
            const couponInput = document.getElementById('couponCode');
            if (couponInput) {
                couponInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        applyCoupon();
                    }
                });
            }
        });

    </script>
</body>
