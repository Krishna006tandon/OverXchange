<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - OverXchange</title>
    <link rel="stylesheet" href="vendornet.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .checkout-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .supplier-group {
            margin-bottom: 2rem;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 1.5rem;
        }
        .supplier-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        .supplier-header img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 1rem;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        .qr-code-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <svg class="logo-svg" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L8 12v1c0 1.1.9 2 2 2h2v2.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                Vendor<span>Net</span>
            </div>
            <ul>
                <li><a href="vendor-dashboard.html" class="nav-link">Dashboard</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="checkout-container">
            <div class="page-header">
                <h1><i class="fas fa-credit-card"></i> Checkout</h1>
                <p>Complete your payment by scanning the QR codes below.</p>
            </div>
            <div id="checkout-summary"></div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadCheckout();
        });

        function loadCheckout() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const summaryContainer = document.getElementById('checkout-summary');

            if (cart.length === 0) {
                summaryContainer.innerHTML = '<p>Your cart is empty.</p>';
                return;
            }

            // Group items by supplier
            const suppliers = {};
            cart.forEach(item => {
                if (!suppliers[item.supplierId]) {
                    suppliers[item.supplierId] = {
                        items: [],
                        total: 0,
                        name: '', // We need to get this from the item
                        upi_id: '', // We need to get this from the item
                        logo: '' // We need to get this from the item
                    };
                }
                suppliers[item.supplierId].items.push(item);
                suppliers[item.supplierId].total += item.price * item.quantity;
            });

            // Fetch product details to get supplier info
            fetch('/api/stocks')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const stocks = data.stocks;
                        // Add supplier info to our suppliers object
                        for (const supplierId in suppliers) {
                            const itemInCart = suppliers[supplierId].items[0];
                            const stockInfo = stocks.find(s => s._id === itemInCart.id);
                            if (stockInfo) {
                                suppliers[supplierId].name = stockInfo.supplier_name;
                                suppliers[supplierId].upi_id = stockInfo.supplier_upi_id;
                                suppliers[supplierId].logo = stockInfo.supplier_business_logo_url;
                            }
                        }
                        renderCheckout(suppliers);
                    }
                });
        }

        function renderCheckout(suppliers) {
            const summaryContainer = document.getElementById('checkout-summary');
            summaryContainer.innerHTML = '';

            for (const supplierId in suppliers) {
                const supplier = suppliers[supplierId];
                const supplierGroup = document.createElement('div');
                supplierGroup.className = 'supplier-group';

                let itemsHtml = '';
                supplier.items.forEach(item => {
                    itemsHtml += `
                        <div class="cart-item">
                            <span>${item.name} (x${item.quantity})</span>
                            <span>₹${(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                    `;
                });

                const upiUrl = `upi://pay?pa=${supplier.upi_id}&pn=${encodeURIComponent(supplier.name)}&am=${supplier.total.toFixed(2)}&tn=OrderPayment`;

                supplierGroup.innerHTML = `
                    <div class="supplier-header">
                        <img src="${supplier.logo || 'https://placehold.co/50x50/808080/FFFFFF?text=Logo'}" alt="${supplier.name}">
                        <h3>${supplier.name}</h3>
                    </div>
                    ${itemsHtml}
                    <div class="cart-item">
                        <strong>Total</strong>
                        <strong>₹${supplier.total.toFixed(2)}</strong>
                    </div>
                    <div class="qr-code-container">
                        <h4>Scan to Pay</h4>
                        <div id="qrcode-${supplierId}"></div>
                        <p>UPI ID: ${supplier.upi_id}</p>
                    </div>
                `;
                summaryContainer.appendChild(supplierGroup);

                new QRCode(document.getElementById(`qrcode-${supplierId}`), {
                    text: upiUrl,
                    width: 128,
                    height: 128,
                });
            }
        }
    </script>
</body>
</html>
