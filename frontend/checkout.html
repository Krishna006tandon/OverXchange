<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - OverXchange</title>
    <link rel="stylesheet" href="vendornet.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .checkout-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .order-summary, .payment-method {
            margin-bottom: 2rem;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 1.5rem;
        }
        .summary-item, .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        .total-row {
            font-weight: bold;
            border-top: 2px solid #333;
            border-bottom: none;
            margin-top: 1rem;
        }
        .place-order-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .place-order-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <svg class="logo-svg" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L8 12v1c0 1.1.9 2 2 2h2v2.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                Vendor<span>Net</span>
            </div>
            <ul>
                <li><a href="vendor-dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="cart.html" class="nav-link">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="checkout-container">
            <div class="page-header">
                <h1><i class="fas fa-shopping-cart"></i> Checkout</h1>
            </div>

            <div class="order-summary">
                <h2>Order Summary</h2>
                <div id="summary-items"></div>
                <div class="total-row">
                    <span>Total</span>
                    <span id="summary-total"></span>
                </div>
            </div>

            <div class="payment-method">
                <h2>Payment Method</h2>
                <div>
                    <input type="radio" id="cod" name="payment" value="cod" checked>
                    <label for="cod">Cash on Delivery</label>
                </div>
            </div>

            <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadOrderSummary();
        });

        function loadOrderSummary() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const summaryContainer = document.getElementById('summary-items');
            const totalContainer = document.getElementById('summary-total');
            let total = 0;

            if (cart.length === 0) {
                summaryContainer.innerHTML = '<p>Your cart is empty.</p>';
                totalContainer.innerText = '₹0.00';
                return;
            }

            summaryContainer.innerHTML = '';
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                const summaryItem = document.createElement('div');
                summaryItem.className = 'summary-item';
                summaryItem.innerHTML = `
                    <span>${item.name} (x${item.quantity})</span>
                    <span>₹${itemTotal.toFixed(2)}</span>
                `;
                summaryContainer.appendChild(summaryItem);
            });

            totalContainer.innerText = `₹${total.toFixed(2)}`;
        }

        function placeOrder() {
            // In a real application, you would send the order to the server here.
            // For this example, we'll just clear the cart and show a confirmation.
            
            localStorage.removeItem('cart');
            
            const container = document.querySelector('.checkout-container');
            container.innerHTML = `
                <div style="text-align: center;">
                    <h2><i class="fas fa-check-circle" style="color: green;"></i> Order Placed Successfully!</h2>
                    <p>Your order will be delivered soon.</p>
                    <a href="vendor-dashboard.html" class="nav-link">Go to Dashboard</a>
                </div>
            `;
        }
    </script>
</body>
</html>
