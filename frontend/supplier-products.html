<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Products - OverXchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(90deg, #3730a3 0%, #6366f1 100%);
            box-shadow: 0 8px 32px 0 rgba(99,102,241,0.18);
            border-radius: 0 0 22px 22px;
            backdrop-filter: blur(12px);
            border-bottom: 2px solid #a5b4fc44;
            padding: 0;
            transition: box-shadow 0.2s;
        }
        
        .navbar-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            height: 72px;
            padding: 0 28px;
        }
        
        .navbar-logo {
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 1.7em;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            margin-right: 38px;
            gap: 12px;
        }
        
        .navbar-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px #6366f133;
        }
        
        .navbar-logo-icon svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }
        
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }
        
        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.13em;
            margin-right: 8px;
            font-weight: 500;
            padding: 10px 22px;
            border-radius: 10px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.18s;
        }
        
        .navbar a:hover {
            background: #fff3;
            color: #3730a3;
            box-shadow: 0 2px 8px #6366f133;
            transform: translateY(-2px) scale(1.04);
        }
        
        .navbar .logout-btn {
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            color: #fff;
            font-weight: 800;
            font-size: 1.13em;
            border: none;
            border-radius: 10px;
            padding: 10px 22px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .navbar .logout-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 4px 12px #6366f133;
        }
        
        .cart-link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .cart-count-nav {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #dc3545;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 18px;
        }
        
        .cart-count-nav:empty {
            display: none;
        }
        
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 28px;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .page-title {
            font-size: 2.5em;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .page-subtitle {
            font-size: 1.2em;
            color: #6b7280;
            margin-bottom: 20px;
        }
        
        .supplier-info {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.1);
            text-align: center;
        }
        
        .supplier-name {
            font-size: 1.8em;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 12px;
        }
        
        .supplier-details {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6b7280;
            font-weight: 500;
        }
        
        .detail-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        
        .products-section {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.1);
        }
        
        .section-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }
        
        .product-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid rgba(99, 102, 241, 0.1);
            border-radius: 20px;
            padding: 32px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
        }
        
        .product-card:hover::before {
            transform: scaleX(1);
        }
        
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .product-name {
            font-size: 1.6em;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            flex: 1;
        }
        
        .stock-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stock-badge.in-stock {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .stock-badge.low-stock {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }
        
        .stock-badge.out-of-stock {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .product-category {
            color: #6366f1;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            padding: 8px 12px;
            border-radius: 12px;
            display: inline-block;
            border: 1px solid rgba(99, 102, 241, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .product-description {
            color: #6b7280;
            font-size: 1em;
            margin-bottom: 24px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
            padding: 16px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 12px;
            border-left: 4px solid #6366f1;
        }
        
        .product-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
            padding: 20px;
            background: rgba(248, 250, 252, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
        }
        
        .detail-item:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9em;
        }
        
        .detail-value {
            font-weight: 500;
            color: #6b7280;
            font-size: 0.9em;
        }
        
        .detail-value.price {
            color: #059669;
            font-weight: 700;
            font-size: 1.1em;
        }
        
        .detail-value.in-stock {
            color: #059669;
            font-weight: 600;
        }
        
        .detail-value.low-stock {
            color: #d97706;
            font-weight: 600;
        }
        
        .detail-value.out-of-stock {
            color: #dc2626;
            font-weight: 600;
        }
        
        .product-price {
            font-size: 2em;
            font-weight: 800;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }
        
        .product-quantity {
            color: #6b7280;
            font-size: 0.9em;
            margin-bottom: 20px;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }
        
        .product-ingredients,
        .product-nutrition,
        .product-storage,
        .product-allergens {
            margin-bottom: 16px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            border-left: 3px solid #6366f1;
            font-size: 0.9em;
            line-height: 1.5;
        }
        
        .product-ingredients {
            border-left-color: #10b981;
        }
        
        .product-nutrition {
            border-left-color: #f59e0b;
        }
        
        .product-storage {
            border-left-color: #6366f1;
        }
        
        .product-allergens {
            border-left-color: #ef4444;
        }
        
        .product-actions {
            display: flex;
            gap: 20px;
            align-items: center;
            position: relative;
            z-index: 1;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(99, 102, 241, 0.1);
        }
        
        .quantity-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .quantity-section label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9em;
        }
        
        .quantity-input {
            width: 100px;
            padding: 12px 16px;
            border: 2px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            color: #1f2937;
        }
        
        .quantity-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            background: white;
        }
        
        .quantity-input:disabled {
            background: #f3f4f6;
            color: #9ca3af;
            border-color: #e5e7eb;
        }
        
        .add-to-cart-btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            flex: 1;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .add-to-cart-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .add-to-cart-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }
        
        .add-to-cart-btn:hover::before {
            left: 100%;
        }
        
        .add-to-cart-btn:active {
            transform: translateY(0) scale(0.98);
        }
        
        .add-to-cart-btn:disabled {
            background: linear-gradient(135deg, #9ca3af 0%, #6b7280 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .add-to-cart-btn:disabled::before {
            display: none;
        }
        
        .loading-products {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .no-products-message {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        
        .no-products-message h3 {
            color: #374151;
            margin-bottom: 12px;
        }
        
        .back-btn {
            background: linear-gradient(135deg, #6b7280 0%, #9ca3af 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(107, 114, 128, 0.3);
        }
        
        .back-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="vendor-dashboard.html" class="navbar-logo">
                <div class="navbar-logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                OverXchange
            </a>
            <div class="navbar-links">
                <a href="vendor-dashboard.html">Dashboard</a>
                <a href="vendor-dashboard.html#order-supplier">Suppliers</a>
                <a href="cart.html" class="cart-link" id="cartLink">
                    <i class="fas fa-shopping-cart"></i>
                    Cart
                    <span class="cart-count-nav" id="cartCountNav">0</span>
                </a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Back Button -->
        <a href="vendor-dashboard.html" class="back-btn">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Back to Dashboard
        </a>
        
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Supplier Products</h1>
            <p class="page-subtitle">Browse and order products from our trusted suppliers</p>
        </div>
        
        <!-- Supplier Information -->
        <div class="supplier-info" id="supplierInfo">
            <div class="supplier-name" id="supplierName">Loading...</div>
            <div class="supplier-details" id="supplierDetails">
                <!-- Supplier details will be loaded here -->
            </div>
        </div>
        
        <!-- Products Section -->
        <div class="products-section">
            <h2 class="section-title">Available Products</h2>
            <div class="products-grid" id="productsGrid">
                <div class="loading-products">
                    <div class="loading-spinner"></div>
                    <p>Loading products...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get supplier ID from URL parameters
        function getSupplierId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('supplier_id');
        }
        
        // Load supplier information
        function loadSupplierInfo(supplierId) {
            fetch(`/api/profile/supplier/${supplierId}`)
                .then(res => res.json())
                .then(data => {
                    const supplierName = document.getElementById('supplierName');
                    const supplierDetails = document.getElementById('supplierDetails');
                    
                    supplierName.textContent = data.business_name || data.company_name || data.name || 'Supplier';
                    
                    let detailsHTML = '';
                    if (data.warehouse_address || data.address) {
                        detailsHTML += `
                            <div class="detail-item">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                                </svg>
                                ${data.warehouse_address || data.address}
                            </div>
                        `;
                    }
                    if (data.product_categories || data.specialization) {
                        detailsHTML += `
                            <div class="detail-item">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                </svg>
                                ${data.product_categories || data.specialization}
                            </div>
                        `;
                    }
                    if (data.phone) {
                        detailsHTML += `
                            <div class="detail-item">
                                <svg viewBox="0 0 24 24">
                                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                                </svg>
                                ${data.phone}
                            </div>
                        `;
                    }
                    
                    supplierDetails.innerHTML = detailsHTML;
                })
                .catch(err => {
                    console.error('Error loading supplier info:', err);
                    document.getElementById('supplierName').textContent = 'Supplier';
                });
        }
        
        // Load products for supplier
        function loadProducts(supplierId) {
            fetch(`/api/stocks/supplier/${supplierId}`)
                .then(res => res.json())
                .then(data => {
                    const productsGrid = document.getElementById('productsGrid');
                    
                    if (data.success && data.stocks && data.stocks.length > 0) {
                        createProductCards(data.stocks);
                    } else {
                        productsGrid.innerHTML = `
                            <div class="no-products-message">
                                <h3>No Products Available</h3>
                                <p>This supplier hasn't added any products yet. Please check back later.</p>
                            </div>
                        `;
                    }
                })
                .catch(err => {
                    console.error('Error loading products:', err);
                    const productsGrid = document.getElementById('productsGrid');
                    productsGrid.innerHTML = `
                        <div class="error-message">
                            <h3>Error Loading Products</h3>
                            <p>Unable to load products at the moment. Please try again later.</p>
                            <button class="add-to-cart-btn" onclick="loadProducts('${supplierId}')">Retry</button>
                        </div>
                    `;
                });
        }
        
        // Create product cards
        function createProductCards(products) {
            const productsGrid = document.getElementById('productsGrid');
            productsGrid.innerHTML = '';
            
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const isOutOfStock = !product.quantity_available || product.quantity_available <= 0;
                const isLowStock = product.quantity_available > 0 && product.quantity_available <= 10;
                
                // Format dates
                const createdDate = product.created_at ? new Date(product.created_at).toLocaleDateString('en-IN') : 'N/A';
                const updatedDate = product.updated_at ? new Date(product.updated_at).toLocaleDateString('en-IN') : 'N/A';
                
                card.innerHTML = `
                    <div class="product-header">
                        <div class="product-name">${product.product_name || 'Product'}</div>
                        <div class="product-category">${product.category || 'General'}</div>
                        ${isOutOfStock ? '<div class="stock-badge out-of-stock">Out of Stock</div>' : 
                          isLowStock ? '<div class="stock-badge low-stock">Low Stock</div>' : 
                          '<div class="stock-badge in-stock">In Stock</div>'}
                    </div>
                    
                    <div class="product-description">
                        <strong>Description:</strong> ${product.description || 'No description available'}
                    </div>
                    
                    <div class="product-details-grid">
                        <div class="detail-item">
                            <span class="detail-label">Price:</span>
                            <span class="detail-value price">₹${product.price_per_unit || 0}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Quantity:</span>
                            <span class="detail-value ${isOutOfStock ? 'out-of-stock' : isLowStock ? 'low-stock' : 'in-stock'}">
                                ${product.quantity_available || 0} units
                            </span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Unit:</span>
                            <span class="detail-value">${product.unit || 'Piece'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">SKU:</span>
                            <span class="detail-value">${product.sku || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Brand:</span>
                            <span class="detail-value">${product.brand || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Weight:</span>
                            <span class="detail-value">${product.weight ? `${product.weight} ${product.weight_unit || 'kg'}` : 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Expiry Date:</span>
                            <span class="detail-value">${product.expiry_date || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Created:</span>
                            <span class="detail-value">${createdDate}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Last Updated:</span>
                            <span class="detail-value">${updatedDate}</span>
                        </div>
                    </div>
                    
                    ${product.ingredients ? `
                        <div class="product-ingredients">
                            <strong>Ingredients:</strong> ${product.ingredients}
                        </div>
                    ` : ''}
                    
                    ${product.nutritional_info ? `
                        <div class="product-nutrition">
                            <strong>Nutritional Info:</strong> ${product.nutritional_info}
                        </div>
                    ` : ''}
                    
                    ${product.storage_instructions ? `
                        <div class="product-storage">
                            <strong>Storage Instructions:</strong> ${product.storage_instructions}
                        </div>
                    ` : ''}
                    
                    ${product.allergen_info ? `
                        <div class="product-allergens">
                            <strong>Allergen Info:</strong> ${product.allergen_info}
                        </div>
                    ` : ''}
                    
                    <div class="product-actions">
                        <div class="quantity-section">
                            <label for="qty-${product._id}">Quantity:</label>
                            <input type="number" id="qty-${product._id}" class="quantity-input" 
                                   placeholder="Qty" min="1" max="${product.quantity_available || 1}" 
                                   value="1" ${isOutOfStock ? 'disabled' : ''}>
                        </div>
                        <button class="add-to-cart-btn" 
                                onclick="addToCart('${product._id}', '${product.product_name}', ${product.price_per_unit}, this)"
                                ${isOutOfStock ? 'disabled' : ''}>
                            ${isOutOfStock ? 'Out of Stock' : 'Add to Cart'}
                        </button>
                    </div>
                `;
                
                productsGrid.appendChild(card);
            });
        }
        
        // Add to cart functionality
        function addToCart(productId, productName, price, button) {
            const quantityInput = button.parentElement.querySelector('.quantity-input');
            const quantity = parseInt(quantityInput.value) || 1;
            
            // Get supplier name from the page
            const supplierName = document.querySelector('.supplier-name').textContent;
            
            // Get supplier ID from URL parameters
            const supplierId = getSupplierId();
            
            // Get product details
            const productCard = button.closest('.product-card');
            const category = productCard.querySelector('.product-category').textContent;
            const unit = productCard.querySelector('.detail-item:nth-child(3) .detail-value').textContent;
            const maxQuantity = parseInt(productCard.querySelector('.detail-item:nth-child(2) .detail-value').textContent);
            
            // Get current cart from localStorage
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            // Check if item already exists in cart
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                // Update quantity if not exceeding max
                if (existingItem.quantity + quantity <= maxQuantity) {
                    existingItem.quantity += quantity;
                } else {
                    alert('Maximum available quantity reached for this item!');
                    return;
                }
            } else {
                // Add new item
                cart.push({
                    id: productId,
                    name: productName,
                    price: price,
                    supplierName: supplierName,
                    supplierId: supplierId, // Add supplier ID for coupon functionality
                    category: category,
                    unit: unit,
                    quantity: quantity,
                    maxQuantity: maxQuantity
                });
            }
            
            // Save cart to localStorage
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Update cart count
            updateCartCount();
            
            // Show success message
            alert(`${quantity} x ${productName} added to cart!`);
            
            // Reset quantity input
            quantityInput.value = 1;
        }
        
        // Logout functionality
        function logout() {
            localStorage.removeItem('user_type');
            localStorage.removeItem('user_id');
            window.location.href = 'index.html';
        }
        
        // Update cart count
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartCountNav = document.getElementById('cartCountNav');
            if (cartCountNav) {
                cartCountNav.textContent = cart.length;
                cartCountNav.style.display = cart.length > 0 ? 'flex' : 'none';
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            const supplierId = getSupplierId();
            
            if (!supplierId) {
                alert('No supplier ID provided. Redirecting to dashboard.');
                window.location.href = 'vendor-dashboard.html';
                return;
            }
            
            // Load supplier info and products
            loadSupplierInfo(supplierId);
            loadProducts(supplierId);
            
            // Update cart count
            updateCartCount();
        });
    </script>
</body>
</html>
